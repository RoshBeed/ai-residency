[project]
name = "ai-residency-week2-vector-search-retrieval"
version = "0.1.0"
description = "Two-tower dual-encoder document retrieval (CBOW word embeddings + GRU query/document towers trained with triplet loss on MS MARCO, served via Redis/RediSearch ANN)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    "datasets>=2.19.0",
    "fastapi",
    "huggingface_hub>=0.23.4",
    "ai-residency-common @ git+https://github.com/RoshBeed/ai-residency-common.git@v0.7.3",
    "numpy",
    "python-dotenv",
    "pyyaml>=6.0",
    "redis>=4.6.0",
    "requests",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "uvicorn[standard]",
    "wandb",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency-week2-vector-search-retrieval"
Repository = "https://github.com/RoshBeed/ai-residency-week2-vector-search-retrieval.git"
"Bug Tracker" = "https://github.com/RoshBeed/ai-residency-week2-vector-search-retrieval/issues"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    "types-tqdm>=4.70",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------------------
# Canonical lint/type config, identical in ai-residency-common, the template and all six
# week repos.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting (replaces isort)
    "N",   # pep8-naming — enforces the naming spec
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

# `import torch.nn.functional as F` is the universal PyTorch idiom; N812 objects to
# it in every repo, so it is waived once here rather than per file.
ignore = ["N812"]

[tool.ruff.lint.per-file-ignores]
# The walkthrough notebook chdirs to the repo root before importing anything, because
# `Config` reads `.env` and resolves its paths relative to cwd. Those imports genuinely
# cannot come first.
"notebooks/*.ipynb" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

# redis-py ships `py.typed` but leaves the low-level `execute_command` unannotated, and
# RediSearch's `FT.SEARCH`/`FT.CREATE` are only reachable through it. This permits calling
# that one library's unannotated functions; it is a decision about a dependency we do not
# control, in the same category as `ignore_missing_imports` below, and does not relax
# anything about this repo's own code.
untyped_calls_exclude = ["redis"]

# Third-party packages that ship no type stubs. These waive stubs for the library,
# not type checking of our own code — no `type: ignore` is used anywhere in this repo.
[[tool.mypy.overrides]]
module = [
    "datasets.*",
    "dotenv.*",
    "wandb.*",
]
ignore_missing_imports = true
