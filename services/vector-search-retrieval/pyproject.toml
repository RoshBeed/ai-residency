[project]
name = "ai-residency-vector-search-retrieval"
version = "0.1.0"
description = "Two-tower dual-encoder document retrieval (CBOW word embeddings + GRU query/document towers trained with triplet loss on MS MARCO, served via Redis/RediSearch ANN)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    "datasets>=2.19.0",
    "fastapi",
    "huggingface_hub>=0.23.4",
    "ai-residency-common",
    "numpy",
    "python-dotenv",
    "pyyaml>=6.0",
    "redis>=4.6.0",
    "requests",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "uvicorn[standard]",
    "wandb",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency-week2-vector-search-retrieval"
Repository = "https://github.com/RoshBeed/ai-residency-week2-vector-search-retrieval.git"
"Bug Tracker" = "https://github.com/RoshBeed/ai-residency-week2-vector-search-retrieval/issues"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    "types-tqdm>=4.70",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
ai-residency-common = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
