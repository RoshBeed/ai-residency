[project]
name = "ai-residency-whisper-fine-tuning"
version = "0.1.0"
description = "Whisper fine-tuned on a single example so a mis-transcribed name comes out right, served via FastAPI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    "ai-residency-common",
    "ai-residency-speech",
    "torch",
    "torchaudio",
    "requests",
    "numpy",
    "fastapi",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency/tree/main/services/whisper-fine-tuning"
Repository = "https://github.com/RoshBeed/ai-residency.git"
"Bug Tracker" = "https://github.com/RoshBeed/ai-residency/issues"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

# The module `Dockerfile.train` runs. One root Dockerfile builds every training
# image, so the one thing that genuinely differs per service is declared here,
# beside the code it names, rather than in a table in the build tooling.
[tool.ai-residency]
train-module = "whisper_fine_tuning.training"

[tool.uv.sources]
ai-residency-common = { workspace = true }
ai-residency-speech = { workspace = true }
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
