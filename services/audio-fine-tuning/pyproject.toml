[project]
name = "ai-residency-audio-fine-tuning"
version = "0.1.0"
description = "Whisper fine-tuning with emotion tokens (Part 1: single-example fine-tuning smoke test; Part 2: CREMA-D/EmoDB/RAVDESS emotion-token data pipeline)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    "ai-residency-common",
    "torch",
    "torchvision",
    "torchaudio",
    "openai-whisper",
    "transformers",
    "matplotlib",
    "requests",
    "librosa",
    "seaborn",
    "numpy",
    "fastapi",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency/tree/main/services/audio-fine-tuning"
Repository = "https://https://github.com/RoshBeed/ai-residency.git"
"Bug Tracker" = "https://github.com/RoshBeed/ai-residency/tree/main/services/audio-fine-tuning/issues"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
ai-residency-common = { workspace = true }
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
