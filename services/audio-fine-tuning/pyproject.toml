[project]
name = "ai-residency-week5-audio-fine-tuning"
version = "0.1.0"
description = "Whisper fine-tuning with emotion tokens (Part 1: single-example fine-tuning smoke test; Part 2: CREMA-D/EmoDB/RAVDESS emotion-token data pipeline)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    "ai-residency-common @ git+https://github.com/RoshBeed/ai-residency-common.git@v0.7.3",
    "torch",
    "torchvision",
    "torchaudio",
    "openai-whisper",
    "transformers",
    "matplotlib",
    "requests",
    "librosa",
    "seaborn",
    "numpy",
    "fastapi",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency-week5-audio-fine-tuning"
Repository = "https://github.com/RoshBeed/ai-residency-week5-audio-fine-tuning.git"
"Bug Tracker" = "https://github.com/RoshBeed/ai-residency-week5-audio-fine-tuning/issues"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------------------
# Canonical lint/type config, identical in ai-residency-common, the template and all six
# week repos.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting (replaces isort)
    "N",   # pep8-naming — enforces the naming spec
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

# `import torch.nn.functional as F` is the universal PyTorch idiom; N812 objects to
# it in every repo, so it is waived once here rather than per file.
ignore = ["N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

# Third-party packages that ship no type stubs. These waive stubs for the library,
# not type checking of our own code — no `type: ignore` is used anywhere in this repo.
[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "matplotlib.*",
    "seaborn.*",
    "whisper.*",
]
ignore_missing_imports = true

# transformers ships partial annotations that leak `no-untyped-call` errors out of
# PreTrainedModel/PreTrainedTokenizer internals. Skipping the import body confines
# that to the library rather than suppressing anything in this repo.
[[tool.mypy.overrides]]
module = ["transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true
