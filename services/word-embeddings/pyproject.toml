[project]
name = "ai-residency-word-embeddings"
version = "0.1.0"
description = "Word2vec CBOW embeddings trained from scratch, exposed through a FastAPI nearest-neighbour and analogy API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    # torch and transformers are kept in the same range deliberately: an old
    # transformers>=4.46-requires-torch>=2.4 mismatch used to silently disable
    # transformers' PyTorch backend, turning CBOWNS (the transformers.PreTrainedModel
    # subclass in models/word2vec/cbow/model.py) into an unusable dummy stub. Bumped
    # together and re-verified (model instantiation + forward pass, not just
    # `uv sync` succeeding) — see TODO.md for what was actually exercised.
    "torch>=2.9.0",
    "ai-residency-common",
    "numpy>=2.3.0",
    "scikit-learn>=1.7.0",
    "wandb>=0.23.0",
    "tqdm>=4.67.0",
    "matplotlib>=3.10.0",
    "nltk>=3.10.0",
    "requests>=2.32.0",
    "fastapi>=0.120.0",
    "uvicorn>=0.38.0",
    "transformers>=4.57.0",
    "huggingface_hub>=0.36.0",
    # db extras (formerly requirements_db.txt)
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency/tree/main/services/word-embeddings"
Repository = "https://https://github.com/RoshBeed/ai-residency.git"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260724",
    "types-tqdm>=4.70.0.20260731",
]

[tool.uv]
package = false

# Put the repo root on sys.path so `tests/` can import `word_embeddings` and the
# without an editable install — these repos are applications, not libraries.
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
ai-residency-common = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
