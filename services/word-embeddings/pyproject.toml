[project]
name = "ai-residency-word-embeddings"
version = "0.1.0"
description = "Word2vec CBOW embeddings trained from scratch, exposed through a FastAPI nearest-neighbour and analogy API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    # torch and transformers are kept in the same range deliberately: an old
    # transformers>=4.46-requires-torch>=2.4 mismatch used to silently disable
    # transformers' PyTorch backend, turning CBOWNS (the transformers.PreTrainedModel
    # subclass in models/word2vec/cbow/model.py) into an unusable dummy stub. Bumped
    # together and re-verified by instantiating CBOWNS and running a forward pass,
    # not just by `uv sync` succeeding -- the failure mode here is a stub class that
    # imports cleanly and does nothing.
    "torch>=2.9.0",
    "ai-residency-common",
    "ai-residency-word2vec",
    "numpy>=2.3.0",
    "scikit-learn>=1.7.0",
    "wandb>=0.23.0",
    "tqdm>=4.67.0",
    "matplotlib>=3.10.0",
    "nltk>=3.10.0",
    "requests>=2.32.0",
    "fastapi>=0.120.0",
    "uvicorn>=0.38.0",
    "transformers>=4.57.0",
    "huggingface_hub>=0.36.0",
]

# The Hacker News corpus stage only. `etl.py` reads a Postgres mirror to build the
# vocabulary, which happens in the training image; `serving/api.py` never imports it,
# so shipping the driver in the serving image was ~15MB and a C extension that no
# running backend loads. `make train-corpus` and Dockerfile.train install this group.
[project.optional-dependencies]
corpus = [
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency/tree/main/services/word-embeddings"
Repository = "https://github.com/RoshBeed/ai-residency.git"

[dependency-groups]
dev = [
    "httpx>=0.27",
    # Named here as well as in the `corpus` extra, and the two mean different things:
    # the extra is what the training image installs to *run* the corpus stage, this is
    # what the checkout needs to type-check `etl.py`, which imports psycopg2 at module
    # scope. Dev groups are never installed into an image, which is the point -- the
    # serving image does not get the driver.
    "psycopg2-binary>=2.9.10",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260724",
    "types-tqdm>=4.70.0.20260731",
]

[tool.uv]
package = false

# Put the repo root on sys.path so `tests/` can import `word_embeddings` and the
# without an editable install — these repos are applications, not libraries.
[tool.pytest.ini_options]
pythonpath = ["."]

# The module `Dockerfile.train` runs. One root Dockerfile builds every training
# image, so the one thing that genuinely differs per service is declared here,
# beside the code it names, rather than in a table in the build tooling.
[tool.ai-residency]
train-module = "word_embeddings.train"

[tool.uv.sources]
ai-residency-common = { workspace = true }
ai-residency-word2vec = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
