# serve starts by default; train is profile-gated so a plain `docker compose up`
# never kicks off a PPO step. Both build FROM roshbeed/ai-residency-base — build that
# locally first with `make docker-build-base` in ai-residency-repo-template (or pull it
# once it's published).
services:
  serve:
    build:
      context: .
      dockerfile: Dockerfile.serve
    ports: ["8000:8000"]
    environment:
      # Serving pulls a checkpoint from the Hub when the container has no local
      # one, so the token belongs here too, not only on train. No trained PPO
      # checkpoint exists for this repo yet — see the write-up's Experimental
      # Results section — so this is an honest generation-only demo.
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      LOG_LEVEL: INFO
      # Reuse the host's model cache so the container does not re-download
      # Qwen3-0.6B-Base on every run.
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface

  train:
    profiles: [train]
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - ./checkpoints:/app/checkpoints
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      LOG_LEVEL: INFO
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      HF_HOME: /root/.cache/huggingface
    # Uncomment on a real GPU host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
