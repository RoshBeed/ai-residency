[project]
name = "ai-residency-rlhf-ppo"
version = "0.1.0"
description = "From-scratch PPO implementation (generation, KL penalty, reward, advantage, policy/value updates) for RLHF fine-tuning of Qwen3-0.6B-Base, built with PyTorch + Hugging Face transformers/peft"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
keywords = ["ppo", "rlhf", "reinforcement-learning", "language-models", "fine-tuning", "lora"]
dependencies = [
    "accelerate>=0.25.0",
    "datasets>=2.14.0",
    "fastapi>=0.110.0",
    "ai-residency-common",
    "numpy>=1.24.0",
    "peft>=0.7.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers>=4.36.0",
    "uvicorn>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency-week6-rlhf-ppo"
Repository = "https://github.com/RoshBeed/ai-residency-week6-rlhf-ppo.git"
"Bug Tracker" = "https://github.com/RoshBeed/ai-residency-week6-rlhf-ppo/issues"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12",
    "types-tqdm>=4.66",
]

[tool.uv]
package = false

[tool.uv.sources]
ai-residency-common = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
