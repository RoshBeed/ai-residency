[project]
# Rename to ai-residency-<service-name> when this template is instantiated.
name = "ai-residency-template"
version = "0.1.0"
description = "Template for the AI Residency portfolio repos"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    "fastapi>=0.110",
    "ai-residency-common",
    "torch>=2.0",
    "uvicorn>=0.27",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

# Put the repo root on sys.path so `tests/` can import the top-level modules without
# an editable install — these repos are applications, not libraries.
[tool.pytest.ini_options]
pythonpath = ["."]

# torch resolves to the CUDA build on linux/arm64 otherwise, which bloats images
# roughly 5-10x. This portfolio runs CPU-only in containers.
[tool.uv.sources]
ai-residency-common = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
