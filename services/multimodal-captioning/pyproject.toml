[project]
name = "ai-residency-multimodal-captioning"
version = "0.1.0"
description = "CLIP + Qwen3 image captioning (zero-shot classification, and a CLIP-vision -> adapter -> Qwen3 captioning pipeline), built for Week 4 of the Machine Learning Institute residency"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    "ai-residency-common",
    "transformers>=4.40",
    "torch>=2.0",
    "torchvision>=0.15",
    "pillow>=9.0",
    "datasets>=2.19",
    "tqdm>=4.64",
    "matplotlib>=3.5",
    "jupyter>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "wandb>=0.23",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency/tree/main/services/multimodal-captioning"
Repository = "https://https://github.com/RoshBeed/ai-residency.git"
"Bug Tracker" = "https://github.com/RoshBeed/ai-residency/tree/main/services/multimodal-captioning/issues"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-tqdm>=4.70",
]

[tool.uv]
package = false

# torch resolves to the CUDA build on linux/arm64 otherwise, which bloats images
# roughly 5-10x. This portfolio runs CPU-only in containers.
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
ai-residency-common = { workspace = true }
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
