[project]
name = "ai-residency-frontend"
version = "0.1.0"
description = "Unified Streamlit frontend calling every AI Residency backend API directly"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "requests>=2.31.0",
    "pillow>=12.3.0",
    "streamlit-drawable-canvas>=0.9.3",
]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

# Same as every other service: the frontend's own modules (client, components,
# projects, theme) are importable from the service root, which is where the container
# runs `streamlit run app.py` from.
[tool.pytest.ini_options]
pythonpath = ["."]
