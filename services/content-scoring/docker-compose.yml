# serve starts by default; train is profile-gated so a plain `docker compose up`
# never kicks off a training run. Both build FROM roshbeed/ai-residency-base — build that
# locally first via ai-residency-repo-template's `make docker-build-base` (or pull it once
# it's published).
#
# Trained artifacts are bind-mounted rather than baked into the images. The scorer's
# own checkpoint lives under checkpoints/; the frozen CBOW embeddings it consumes are
# pulled from the word-embeddings repo's Hugging Face repo (or bind-mounted at
# checkpoints/cbow/).
services:
  serve:
    build:
      context: .
      dockerfile: Dockerfile.serve
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints:ro
    environment:
      # Serving pulls a checkpoint from the Hub when the container has no local
      # one, so the token belongs here too, not only on train.
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}

  train:
    profiles: ["train"]
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - ./checkpoints:/app/checkpoints
    environment:
      LOG_LEVEL: INFO
      # Taken from the shell, which is where `.env` has already been loaded.
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
    # GPU reservation (inert on this host — this repo's scorer is small enough to
    # train on CPU, but a real GPU host can uncomment this):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
