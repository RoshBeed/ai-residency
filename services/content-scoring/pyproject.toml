[project]
name = "ai-residency-content-scoring"
version = "0.1.0"
description = "Hacker News score prediction: four fusion architectures over extended word vectors and post metadata, served through FastAPI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    "torch>=2.9.0",
    "ai-residency-common",
    # The vocabulary-extension stage continues training the sibling service's vectors
    # on the Hacker News title corpus, so it needs the model and the negative sampler;
    # `benchmarks` is how it shows that did not damage them.
    "ai-residency-word2vec",
    "numpy>=2.3.0",
    # The corpus is a 49MB parquet of ~870k posts. Reading it as JSON was never going
    # to work, and pandas is what the feature stage's groupbys and the eval harness's
    # slice tables are written against.
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
    # TF-IDF + Ridge is the baseline that decides whether the neural work earned its
    # keep, and scipy supplies the Spearman the whole eval is ranked on.
    "scikit-learn>=1.7.0",
    "scipy>=1.14",
    "wandb>=0.23.0",
    "tqdm>=4.67.0",
    "matplotlib>=3.10.0",
    "fastapi>=0.120.0",
    "uvicorn>=0.38.0",
    "huggingface_hub>=0.36.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency/tree/main/services/content-scoring"
Repository = "https://github.com/RoshBeed/ai-residency.git"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pandas-stubs>=2.2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

# Put the repo root on sys.path so `tests/` can import `content_scoring` and the
# top-level modules without an editable install — these repos are applications, not
# libraries.
[tool.pytest.ini_options]
pythonpath = ["."]

# The module `Dockerfile.train` runs. One root Dockerfile builds every training
# image, so the one thing that genuinely differs per service is declared here,
# beside the code it names, rather than in a table in the build tooling.
[tool.ai-residency]
train-module = "content_scoring.train"

[tool.uv.sources]
ai-residency-common = { workspace = true }
ai-residency-word2vec = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
