[project]
name = "ai-residency-week1-content-scoring"
version = "0.1.0"
description = "A regression head over frozen CBOW embeddings, predicting an engagement score from a title, served through FastAPI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    "torch>=2.9.0",
    "ai-residency-common @ git+https://github.com/RoshBeed/ai-residency-common.git@v0.7.3",
    "numpy>=2.3.0",
    "fastapi>=0.120.0",
    "uvicorn>=0.38.0",
    "huggingface_hub>=0.36.0",
    "python-dotenv>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/RoshBeed/ai-residency-week1-content-scoring"
Repository = "https://github.com/RoshBeed/ai-residency-week1-content-scoring.git"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

# Put the repo root on sys.path so `tests/` can import `content_scoring` and the
# top-level modules without an editable install — these repos are applications, not
# libraries.
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------------------
# Canonical lint/type config, identical in ai-residency-common, the template and all
# week repos.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting (replaces isort)
    "N",   # pep8-naming — enforces the naming spec
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

# `import torch.nn.functional as F` is the universal PyTorch idiom; N812 objects to
# it in every repo, so it is waived once here rather than per file.
ignore = ["N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "wandb.*",
]
ignore_missing_imports = true
