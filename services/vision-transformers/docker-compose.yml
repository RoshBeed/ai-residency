services:
  classifier-train:
    profiles:
      - train
    build:
      context: .
      dockerfile: models/classifier/Dockerfile
    image: mnist-digit-classifier-train:latest
    volumes:
      - model-data:/app/model_data
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  seq2seq-train:
    profiles:
      - train
    build:
      context: .
      dockerfile: models/seq2seq/Dockerfile
    image: mnist-digit-seq2seq-train:latest
    volumes:
      - model-data:/app/model_data
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  model-serve:
    build:
      context: .
      dockerfile: services/Dockerfile
    image: mnist-digit-transformer-serve:latest
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./model_data:/app/model_data
    environment:
      - PYTHONPATH=/app
    # Optional GPU support for inference (uncomment if needed)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  streamlit:
    build:
      context: streamlit
      dockerfile: Dockerfile
    image: mnist-digit-transformer-streamlit:latest
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./model_data:/app/model_data
    environment:
      MODEL_URL: "http://model-serve:8000/predict"
      BOTH_MODELS_URL: "http://model-serve:8000/predict/both"
      MODELS_URL: "http://model-serve:8000/models"

volumes:
  model-data: