services:
  model-train:
    profiles:
      - train
    build:
      context: transformer
      dockerfile: Dockerfile.train
    image: mnist-digit-transformer-model-train:latest
    volumes:
      - model-data:/app/model_data  # Shared volume for model.pth
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  s2s-train:
    profiles:
      - train
    build:
      context: .
      dockerfile: s2s_vit/Dockerfile
    image: mnist-digit-seq2seq-train:latest
    volumes:
      - model-data:/app/model_data  # Shared volume for seq2seq model.pth
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  model-serve:
    build:
      context: transformer
      dockerfile: Dockerfile.serve
    image: mnist-digit-classifier-transformer-serve:latest
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - model-data:/app/model_data  # Access to both ViT and seq2seq models
    # Optional GPU support for inference (uncomment if needed)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  streamlit:
    build:
      context: streamlit
      dockerfile: Dockerfile
    image: mnist-digit-transformer-streamlit:latest
    restart: always
    ports:
      - "8501:8501"
    environment:
      MODEL_URL: "http://model-serve:8000/predict"
      VIT_URL: "http://model-serve:8000/predict/vit"
      SEQ2SEQ_URL: "http://model-serve:8000/predict/seq2seq"
      MODELS_URL: "http://model-serve:8000/models"

volumes:
  model-data:  # Shared volume for both ViT and seq2seq models