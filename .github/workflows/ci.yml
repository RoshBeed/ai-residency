# One workflow for the whole workspace.
#
# There was no CI in any of the eleven repos this replaced, and the reason was
# structural: ai-residency-common was a private git dependency, so every repo
# needed its own personal access token configured before it could even install.
# As a workspace member it needs no credential at all, and the only secrets here
# are the ones that publish images.
#
# Isolation comes from path filters rather than from separate repositories: a
# commit touching one service type-checks and tests that service. A commit touching
# libs/common checks everything, which is correct -- it is the one thing they
# genuinely share.
#
# Publishing deliberately does NOT follow the filter. Every push to main publishes all
# ten images under one `sha-<commit>` tag, so that tag names a complete set that
# deploy/ can pin. When only the changed service was published, most SHAs existed for
# some images and not others, and the "reproducible from a single identifier" claim in
# the README was not something the registry could actually honour.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Republish without inventing a commit. A dispatch selects every service,
  # since there is no diff to narrow it down.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: roshb

jobs:
  changes:
    name: Which services changed
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      all: ${{ steps.detect.outputs.all }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          changed=$(git diff --name-only "$base" HEAD)
          all=$(ls -d services/*/ | sed 's|services/||;s|/||' | grep -v '^_template$')

          # The shared library, the lockfile, the lint config and CI itself all
          # affect every service.
          #
          # `if` rather than `grep -q ... && echo`: under `set -e` a failing `&&`
          # list as the loop's last command makes the whole substitution exit 1,
          # which killed this step whenever the *last* service was unchanged --
          # and on any push whose diff is empty.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            selected="$all"
          elif echo "$changed" | grep -qE '^(libs/common/|uv\.lock|pyproject\.toml|\.github/)'; then
            selected="$all"
          else
            selected=$(for s in $all; do
              if echo "$changed" | grep -q "^services/$s/"; then echo "$s"; fi
            done)
          fi

          # An empty selection has to serialise as [] -- `printf | jq -R` on an
          # empty string yields [""], a matrix with one nameless service.
          if [ -z "$selected" ]; then
            json='[]'
          else
            json=$(printf '%s\n' $selected | jq -R . | jq -sc .)
          fi
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$selected" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # Checks are narrowed by the path filter; publishing is not. Every push to
          # main publishes all ten images under one sha- tag, so that tag names a
          # complete, deployable set. Publishing only what changed meant most SHAs
          # existed for some images and not others, and `deploy/` pinning one tag was
          # a claim the registry could not honour. The layer cache makes the images
          # whose inputs did not change nearly free to republish.
          echo "all=$(printf '%s\n' $all | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "Selected for checks: ${selected:-none}"
          echo "Published on main:   $all"

  lint:
    name: Lint (whole workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  check:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install this service only
        run: uv sync --frozen --package ai-residency-${{ matrix.service }}

      # mypy runs from inside the service: each one has its own top-level
      # `config` package, so a single invocation across the tree sees several
      # modules named `config` and refuses to start.
      - name: Type-check
        working-directory: services/${{ matrix.service }}
        run: uv run --project . mypy --config-file ../../pyproject.toml .

      # pytest exits 5 on "no tests collected", which is a fact about a service
      # rather than a failure. Every service has a suite now, including the frontend
      # -- its display helpers, project metadata and HTTP client live in Streamlit-free
      # modules precisely so they can be imported and asserted against here.
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            uv run --project . pytest -q
          else
            echo "::warning::${{ matrix.service }} has no tests/ directory"
          fi

  # The serving base, once, rather than rebuilt inside each of the ten service
  # jobs. Multi-arch: the runners are x86-64, but a reviewer on Apple Silicon --
  # and this project's own Kubernetes node -- are arm64, and an amd64-only image
  # fails there with "no matching manifest" rather than anything informative.
  # The arm64 half is QEMU-emulated, which is why the layer cache matters.
  images-base:
    name: Publish serving base
    needs: [changes, lint, check]
    # Publishing is gated on a repository variable, so it never happens by
    # accident. Training images are not built here: they carry the CUDA stack,
    # they are ~9GB, and amd64 is the only architecture a GPU box is. They have
    # their own on-demand workflow.
    #
    # `always()` with explicit result checks, not a bare `needs:`. A commit that
    # touches no service skips the `check` matrix entirely, and a skipped dependency
    # skips everything downstream by default -- so a docs-only commit to main would
    # publish nothing and leave a sha- tag that names no images. Publish whenever
    # nothing actually failed.
    if: |
      always()
      && needs.lint.result == 'success'
      && (needs.check.result == 'success' || needs.check.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=base-serve
          cache-to: type=gha,scope=base-serve,mode=max
          tags: |
            ${{ env.REGISTRY }}/ai-residency-base-serve:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/ai-residency-base-serve:latest

  images:
    name: Publish ${{ matrix.service }}
    needs: [changes, images-base]
    if: needs.images-base.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `all`, not `services`: see the note in the detect step. One sha- tag has to
        # name every image, or pinning it in deploy/ does not describe a real set.
        service: ${{ fromJSON(needs.changes.outputs.all) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The frontend's image has no -serve suffix: it is the only service with one
      # image rather than a serving/training pair.
      - name: Image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "name=${{ env.REGISTRY }}/ai-residency-frontend" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ env.REGISTRY }}/ai-residency-${{ matrix.service }}-serve" >> "$GITHUB_OUTPUT"
          fi

      # Both tags come off one commit, which is what makes a deployment
      # reproducible: deploy/ pins the SHA, not a moving `latest`. BASE_IMAGE is
      # pinned to this commit's base for the same reason.
      # Built into the runner's own docker first, native amd64 only, so the next step
      # has something to actually run. The multi-arch push happens after it passes --
      # a `push: true` build produces no local image to test, which is how this
      # pipeline came to publish images nothing had ever executed.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile.serve
          load: true
          platforms: linux/amd64
          build-args: |
            ${{ matrix.service != 'frontend'
                && format('BASE_IMAGE={0}/ai-residency-base-serve:sha-{1}', env.REGISTRY, github.sha)
                || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          tags: smoke:${{ matrix.service }}

      # The check that would have caught the two most expensive mistakes available here.
      #
      # A `USER app` whose filesystem ownership is wrong builds perfectly and then fails
      # on the first write. A service that stops registering /ready builds perfectly and
      # then silently takes its whole fleet out of readiness, because a missing route
      # answers 404 and a 404 fails a readiness probe forever. Neither shows up in a
      # build log, a unit test, or a vulnerability scan.
      #
      # Deliberately does not start the server: several of these load multi-GB backbones
      # in their lifespan, which does not fit a runner. Importing the app and reading its
      # route table proves the contract is wired without paying for the weights.
      - name: Smoke-test the image
        if: matrix.service != 'frontend'
        run: |
          set -euo pipefail
          image=smoke:${{ matrix.service }}

          echo "::group::runs as a non-root user"
          uid=$(docker run --rm --entrypoint id "$image" -u)
          echo "uid=$uid"
          if [ "$uid" = "0" ]; then
            echo "::error::${{ matrix.service }} runs as root"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::the app exposes /health and /ready"
          docker run --rm --entrypoint python "$image" -c '
          from serving.api import app
          paths = {route.path for route in app.routes}
          missing = {"/health", "/ready"} - paths
          assert not missing, f"missing {missing}; has {sorted(paths)}"
          print("routes ok:", sorted(p for p in paths if p in {"/health", "/ready"}))
          '
          echo "::endgroup::"

          echo "::group::the working directory is writable by that user"
          docker run --rm --entrypoint sh "$image" -c 'touch ./.probe && rm ./.probe'
          echo "::endgroup::"

      # The frontend is a Streamlit app, not a FastAPI backend, so it gets the checks
      # that do apply to it: non-root, and a page flow that imports.
      - name: Smoke-test the frontend image
        if: matrix.service == 'frontend'
        run: |
          set -euo pipefail
          image=smoke:frontend
          uid=$(docker run --rm --entrypoint id "$image" -u)
          if [ "$uid" = "0" ]; then
            echo "::error::frontend runs as root"
            exit 1
          fi
          docker run --rm --entrypoint python "$image" -c '
          import client, components, projects, theme
          assert projects.API_URLS and projects.PROJECTS
          print("frontend modules import; backends wired:", len(projects.API_URLS))
          '

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile.serve
          push: true
          platforms: linux/amd64,linux/arm64
          # The frontend builds FROM python:3.11-slim directly -- it has no ML
          # dependencies -- so it takes no base image.
          build-args: |
            ${{ matrix.service != 'frontend'
                && format('BASE_IMAGE={0}/ai-residency-base-serve:sha-{1}', env.REGISTRY, github.sha)
                || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  # A published image is the artifact people actually run, so it is the thing worth
  # scanning -- a lockfile audit misses everything the base OS contributes.
  #
  # Scans the serving base rather than all ten images: they share every layer below
  # their own source, so ten scans would report the same CVEs ten times. Reports rather
  # than blocks (`exit-code: 0`): a base-image CVE with no fix available should not
  # stop a portfolio deploy, but it should be visible. Results land in the repository's
  # Security tab.
  scan:
    name: Scan the published base image
    needs: images-base
    if: needs.images-base.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/ai-residency-base-serve:sha-${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-base-serve
