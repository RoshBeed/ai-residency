# One workflow for the whole workspace.
#
# There was no CI in any of the eleven repos this replaced, and the reason was
# structural: ai-residency-common was a private git dependency, so every repo
# needed its own personal access token configured before it could even install.
# As a workspace member it needs no credential at all, and the only secrets here
# are the ones that publish images.
#
# Isolation comes from path filters rather than from separate repositories: a
# commit touching one service checks and builds that service. A commit touching
# libs/common checks everything, which is correct -- it is the one thing they
# genuinely share.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Republish without inventing a commit. A dispatch selects every service,
  # since there is no diff to narrow it down.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: roshb

jobs:
  changes:
    name: Which services changed
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          changed=$(git diff --name-only "$base" HEAD)
          all=$(ls -d services/*/ | sed 's|services/||;s|/||' | grep -v '^_template$')

          # The shared library, the lockfile, the lint config and CI itself all
          # affect every service.
          #
          # `if` rather than `grep -q ... && echo`: under `set -e` a failing `&&`
          # list as the loop's last command makes the whole substitution exit 1,
          # which killed this step whenever the *last* service was unchanged --
          # and on any push whose diff is empty.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            selected="$all"
          elif echo "$changed" | grep -qE '^(libs/common/|uv\.lock|pyproject\.toml|\.github/)'; then
            selected="$all"
          else
            selected=$(for s in $all; do
              if echo "$changed" | grep -q "^services/$s/"; then echo "$s"; fi
            done)
          fi

          # An empty selection has to serialise as [] -- `printf | jq -R` on an
          # empty string yields [""], a matrix with one nameless service.
          if [ -z "$selected" ]; then
            json='[]'
          else
            json=$(printf '%s\n' $selected | jq -R . | jq -sc .)
          fi
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$selected" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Selected: ${selected:-none}"

  lint:
    name: Lint (whole workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  check:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install this service only
        run: uv sync --frozen --package ai-residency-${{ matrix.service }}

      # mypy runs from inside the service: each one has its own top-level
      # `config` package, so a single invocation across the tree sees several
      # modules named `config` and refuses to start.
      - name: Type-check
        working-directory: services/${{ matrix.service }}
        run: uv run --project . mypy --config-file ../../pyproject.toml .

      # pytest exits 5 on "no tests collected", which is a fact about a service
      # rather than a failure. The frontend is the one with no suite: app.py runs
      # its whole page flow at import, so its helpers cannot be imported without a
      # Streamlit runtime. Extracting them into a module is the fix, and is worth
      # doing -- a strict type check already found a real bytes/str bug in there.
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            uv run --project . pytest -q
          else
            echo "::warning::${{ matrix.service }} has no tests/ directory"
          fi

  # The serving base, once, rather than rebuilt inside each of the ten service
  # jobs. Multi-arch: the runners are x86-64, but a reviewer on Apple Silicon --
  # and this project's own Kubernetes node -- are arm64, and an amd64-only image
  # fails there with "no matching manifest" rather than anything informative.
  # The arm64 half is QEMU-emulated, which is why the layer cache matters.
  images-base:
    name: Publish serving base
    needs: [changes, lint, check]
    # Publishing is gated on a repository variable, so it never happens by
    # accident. Training images are not built here: they carry the CUDA stack,
    # they are ~9GB, and amd64 is the only architecture a GPU box is. They have
    # their own on-demand workflow.
    if: |
      github.ref == 'refs/heads/main'
      && needs.changes.outputs.any == 'true'
      && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=base-serve
          cache-to: type=gha,scope=base-serve,mode=max
          tags: |
            ${{ env.REGISTRY }}/ai-residency-base-serve:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/ai-residency-base-serve:latest

  images:
    name: Publish ${{ matrix.service }}
    needs: [changes, images-base]
    if: |
      github.ref == 'refs/heads/main'
      && needs.changes.outputs.any == 'true'
      && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The frontend's image has no -serve suffix: it is the only service with one
      # image rather than a serving/training pair.
      - name: Image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "name=${{ env.REGISTRY }}/ai-residency-frontend" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ env.REGISTRY }}/ai-residency-${{ matrix.service }}-serve" >> "$GITHUB_OUTPUT"
          fi

      # Both tags come off one commit, which is what makes a deployment
      # reproducible: deploy/ pins the SHA, not a moving `latest`. BASE_IMAGE is
      # pinned to this commit's base for the same reason.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile.serve
          push: true
          platforms: linux/amd64,linux/arm64
          # The frontend builds FROM python:3.11-slim directly -- it has no ML
          # dependencies -- so it takes no base image.
          build-args: |
            ${{ matrix.service != 'frontend'
                && format('BASE_IMAGE={0}/ai-residency-base-serve:sha-{1}', env.REGISTRY, github.sha)
                || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
