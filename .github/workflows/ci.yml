# One workflow for the whole workspace.
#
# There was no CI in any of the eleven repos this replaced, and the reason was
# structural: ai-residency-common was a private git dependency, so every repo
# needed its own personal access token configured before it could even install.
# As a workspace member it needs no credential at all, and the only secrets here
# are the ones that publish images.
#
# Isolation comes from path filters rather than from separate repositories: a
# commit touching one service type-checks and tests that service. A commit touching
# libs/common checks everything, which is correct -- it is the one thing they
# genuinely share.
#
# Publishing deliberately does NOT follow the filter. Every push to main publishes all
# ten images under one `sha-<commit>` tag, so that tag names a complete set that
# deploy/ can pin. When only the changed service was published, most SHAs existed for
# some images and not others, and the "reproducible from a single identifier" claim in
# the README was not something the registry could actually honour.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Monday 04:00 UTC, for the vulnerability scan only -- every other job is gated
  # off `schedule`. A CVE disclosed against an image that has not changed is
  # invisible to a push-triggered scan.
  schedule:
    - cron: "0 4 * * 1"
  # Republish without inventing a commit. A dispatch selects every service,
  # since there is no diff to narrow it down.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: roshb

jobs:
  changes:
    name: Which services changed
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      members: ${{ steps.detect.outputs.members }}
      all: ${{ steps.detect.outputs.all }}
      any: ${{ steps.detect.outputs.any }}
      shared: ${{ steps.detect.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          changed=$(git diff --name-only "$base" HEAD)
          all=$(ls -d services/*/ | sed 's|services/||;s|/||' | grep -v '^_template$')

          # Every checkable member, as a path. Libraries are checked too, which they
          # were not before: the matrix covered services only, so libs/common's own
          # test suite -- the most-shared code here -- had never actually run in CI.
          # A change to it triggered every service, which exercises it through their
          # imports, but never ran its own tests.
          #
          # `ai-residency-<basename>` is the package name for every member, libraries
          # included, so one matrix can cover both.
          members=$(ls -d libs/*/ services/*/ | sed 's|/$||' | grep -v '/_template$')

          # The shared library, the lockfile, the lint config and CI itself all
          # affect every service.
          #
          # `if` rather than `grep -q ... && echo`: under `set -e` a failing `&&`
          # list as the loop's last command makes the whole substitution exit 1,
          # which killed this step whenever the *last* service was unchanged --
          # and on any push whose diff is empty.
          # A shared input -- the libraries, the lockfile, pyproject, CI itself or any
          # Dockerfile -- is in every image, so it invalidates all of them including
          # the base. Recorded as its own output because publishing now uses it to
          # decide whether an image can be retagged instead of rebuilt.
          shared=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            shared=true
            selected="$all"
            selected_members="$members"
          elif echo "$changed" | grep -qE '^(libs/|uv\.lock|pyproject\.toml|\.github/|Dockerfile)'; then
            shared=true
            selected="$all"
            selected_members="$members"
          else
            selected=$(for s in $all; do
              if echo "$changed" | grep -q "^services/$s/"; then echo "$s"; fi
            done)
            selected_members=$(for m in $members; do
              if echo "$changed" | grep -q "^$m/"; then echo "$m"; fi
            done)
          fi

          # An empty selection has to serialise as [] -- `printf | jq -R` on an
          # empty string yields [""], a matrix with one nameless entry.
          if [ -z "$selected" ]; then
            json='[]'
          else
            json=$(printf '%s\n' $selected | jq -R . | jq -sc .)
          fi
          if [ -z "$selected_members" ]; then
            members_json='[]'
          else
            members_json=$(printf '%s\n' $selected_members | jq -R . | jq -sc .)
          fi
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "members=$members_json" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$selected_members" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "shared=$shared" >> "$GITHUB_OUTPUT"

          # Checks are narrowed by the path filter; publishing is not. Every push to
          # main publishes all ten images under one sha- tag, so that tag names a
          # complete, deployable set. Publishing only what changed meant most SHAs
          # existed for some images and not others, and `deploy/` pinning one tag was
          # a claim the registry could not honour. The layer cache makes the images
          # whose inputs did not change nearly free to republish.
          echo "all=$(printf '%s\n' $all | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "Selected for checks: ${selected:-none}"
          echo "Published on main:   $all"

  lint:
    name: Lint (whole workspace)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv stays on v7 deliberately. v8, v9 and v10 are three consecutive
      # breaking majors, and v9's break is that it caches far more aggressively --
      # billed cache usage, not a behaviour this repo asked for. Crossing three of
      # those is a migration to do on purpose, not a version bump to drift into.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  # One job per workspace member -- libraries as well as services. `matrix.member` is
  # a path (libs/common, services/rlhf-ppo), and the package name is always
  # ai-residency-<basename>, which is what lets one matrix cover both.
  check:
    name: ${{ matrix.member }}
    needs: changes
    if: needs.changes.outputs.any == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.changes.outputs.members) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install this member only
        run: uv sync --frozen --package "ai-residency-$(basename ${{ matrix.member }})"

      # mypy runs from inside the member: each service has its own top-level
      # `config` package, so a single invocation across the tree sees several
      # modules named `config` and refuses to start.
      - name: Type-check
        working-directory: ${{ matrix.member }}
        run: uv run --project . mypy --config-file ../../pyproject.toml .

      # pytest exits 5 on "no tests collected", which is a fact about a service
      # rather than a failure. Every service has a suite now, including the frontend
      # -- its display helpers, project metadata and HTTP client live in Streamlit-free
      # modules precisely so they can be imported and asserted against here.
      - name: Test
        working-directory: ${{ matrix.member }}
        run: |
          if [ -d tests ]; then
            uv run --project . pytest -q
          else
            echo "::warning::${{ matrix.member }} has no tests/ directory"
          fi

  # The serving base, once, rather than rebuilt inside each of the ten service
  # jobs. Multi-arch: the runners are x86-64, but a reviewer on Apple Silicon --
  # and this project's own Kubernetes node -- are arm64, and an amd64-only image
  # fails there with "no matching manifest" rather than anything informative.
  # The arm64 half is QEMU-emulated, which is why the layer cache matters.
  images-base:
    name: Publish serving base
    needs: [changes, lint, check]
    # Publishing is gated on a repository variable, so it never happens by
    # accident. Training images are not built here: they carry the CUDA stack,
    # they are ~9GB, and amd64 is the only architecture a GPU box is. They have
    # their own on-demand workflow.
    #
    # `always()` with explicit result checks, not a bare `needs:`. A commit that
    # touches no service skips the `check` matrix entirely, and a skipped dependency
    # skips everything downstream by default -- so a docs-only commit to main would
    # publish nothing and leave a sha- tag that names no images. Publish whenever
    # nothing actually failed.
    if: |
      always()
      && needs.lint.result == 'success'
      && (needs.check.result == 'success' || needs.check.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && github.event_name != 'schedule'
      && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same rebuild-or-retag question as the service images, and the base is the
      # single most expensive one -- everything else caches from it. It changes only
      # when its Dockerfile or the dependency set does, which is exactly what the
      # `all` selection already means.
      - name: Rebuild or retag
        id: plan
        run: |
          set -euo pipefail
          image='${{ env.REGISTRY }}/ai-residency-base-serve'
          if [ '${{ needs.changes.outputs.shared }}' = 'true' ] \
             || ! docker manifest inspect "$image:latest" >/dev/null 2>&1; then
            echo "retag=false" >> "$GITHUB_OUTPUT"
            echo "rebuilding the base"
          else
            echo "retag=true" >> "$GITHUB_OUTPUT"
            echo "base unchanged: retagging"
          fi

      - uses: docker/build-push-action@v7
        if: steps.plan.outputs.retag != 'true'
        with:
          context: .
          file: Dockerfile.base
          push: true
          # amd64 only. arm64 has to be emulated through QEMU on an x86 runner, and
          # measured across a full publish that cost 8.4 minutes -- 47% of all build
          # time -- to produce images nothing in the deployment path runs: the cluster,
          # the GPU host and these runners are all x86-64. It existed so the images ran
          # natively on an Apple Silicon laptop, and `make base && make build
          # SERVICE=<name>` builds natively there in less time than CI was spending.
          platforms: linux/amd64
          cache-from: type=gha,scope=base-serve
          cache-to: type=gha,scope=base-serve,mode=max
          tags: |
            ${{ env.REGISTRY }}/ai-residency-base-serve:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/ai-residency-base-serve:latest

      - name: Retag the unchanged base
        if: steps.plan.outputs.retag == 'true'
        run: |
          set -euo pipefail
          image='${{ env.REGISTRY }}/ai-residency-base-serve'
          docker buildx imagetools create -t "$image:sha-${{ github.sha }}" "$image:latest"
          echo "::notice::base unchanged -- retagged rather than rebuilt"

  images:
    name: Publish ${{ matrix.service }}
    needs: [changes, images-base]
    # `always()` for the same reason images-base needs it: a commit that touches no
    # service skips the check matrix, and a skip propagates to everything downstream
    # unless the condition contains a status function. Without it, a docs-only commit
    # published the base image and none of the ten that depend on it -- a sha- tag
    # naming an incomplete set, which is exactly what publishing-all exists to avoid.
    if: always() && needs.images-base.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `all`, not `services`: see the note in the detect step. One sha- tag has to
        # name every image, or pinning it in deploy/ does not describe a real set.
        service: ${{ fromJSON(needs.changes.outputs.all) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The frontend's image has no -serve suffix: it is the only service with one
      # image rather than a serving/training pair.
      - name: Image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "name=${{ env.REGISTRY }}/ai-residency-frontend" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ env.REGISTRY }}/ai-residency-${{ matrix.service }}-serve" >> "$GITHUB_OUTPUT"
          fi

      # Rebuild, or just point a new tag at the manifest we already have?
      #
      # The invariant is that one sha- tag names a *complete* set, so `deploy/` can pin
      # it. That needs a complete set of tags, not a complete set of builds -- and a
      # registry can add a tag to an existing manifest server-side, in seconds, without
      # rebuilding or re-pushing a byte.
      #
      # This used to rebuild all ten every push, on the assumption the layer cache made
      # unchanged images "nearly free". Measured, it was not: publishing was 78% of this
      # repo's Actions minutes at ~3 min per image, because a cache hit still pays for
      # QEMU-emulated arm64, cache transfer and manifest assembly. A docs-only commit
      # was costing half an hour to republish ten identical images.
      #
      # Rebuild when this service actually changed, or when it has no `latest` to copy
      # (a service published for the first time). `changes` already treats libs/, the
      # lockfile, pyproject, .github/ and any Dockerfile as touching everything, so the
      # base image and shared code cannot go stale underneath a retag.
      - name: Rebuild or retag
        id: plan
        run: |
          set -euo pipefail
          image='${{ steps.image.outputs.name }}'
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            reason='manual run'
          elif echo '${{ needs.changes.outputs.services }}' \
               | jq -e --arg s '${{ matrix.service }}' 'index($s)' >/dev/null; then
            reason='source changed'
          elif ! docker manifest inspect "$image:latest" >/dev/null 2>&1; then
            reason='never published'
          else
            echo "retag=true" >> "$GITHUB_OUTPUT"
            echo "unchanged: retagging $image:latest as sha-${{ github.sha }}"
            exit 0
          fi
          echo "retag=false" >> "$GITHUB_OUTPUT"
          echo "rebuilding ($reason)"

      # Both tags come off one commit, which is what makes a deployment
      # reproducible: deploy/ pins the SHA, not a moving `latest`. BASE_IMAGE is
      # pinned to this commit's base for the same reason.
      # Built into the runner's own docker first, native amd64 only, so the next step
      # has something to actually run. The multi-arch push happens after it passes --
      # a `push: true` build produces no local image to test, which is how this
      # pipeline came to publish images nothing had ever executed.
      - name: Build for the smoke test
        if: steps.plan.outputs.retag != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile.serve
          load: true
          platforms: linux/amd64
          build-args: |
            ${{ matrix.service != 'frontend'
                && format('BASE_IMAGE={0}/ai-residency-base-serve:sha-{1}', env.REGISTRY, github.sha)
                || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          tags: smoke:${{ matrix.service }}

      # The check that would have caught the two most expensive mistakes available here.
      #
      # A `USER app` whose filesystem ownership is wrong builds perfectly and then fails
      # on the first write. A service that stops registering /ready builds perfectly and
      # then silently takes its whole fleet out of readiness, because a missing route
      # answers 404 and a 404 fails a readiness probe forever. Neither shows up in a
      # build log, a unit test, or a vulnerability scan.
      #
      # Deliberately does not start the server: several of these load multi-GB backbones
      # in their lifespan, which does not fit a runner. Importing the app and reading its
      # route table proves the contract is wired without paying for the weights.
      - name: Smoke-test the image
        if: steps.plan.outputs.retag != 'true' && matrix.service != 'frontend'
        run: |
          set -euo pipefail
          image=smoke:${{ matrix.service }}

          echo "::group::runs as a non-root user"
          uid=$(docker run --rm --entrypoint id "$image" -u)
          echo "uid=$uid"
          if [ "$uid" = "0" ]; then
            echo "::error::${{ matrix.service }} runs as root"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::the app exposes /health and /ready"
          docker run --rm --entrypoint python "$image" -c '
          from serving.api import app
          paths = {route.path for route in app.routes}
          missing = {"/health", "/ready"} - paths
          assert not missing, f"missing {missing}; has {sorted(paths)}"
          print("routes ok:", sorted(p for p in paths if p in {"/health", "/ready"}))
          '
          echo "::endgroup::"

          echo "::group::the working directory is writable by that user"
          docker run --rm --entrypoint sh "$image" -c 'touch ./.probe && rm ./.probe'
          echo "::endgroup::"

      # The frontend is a Streamlit app, not a FastAPI backend, so it gets the checks
      # that do apply to it: non-root, and a page flow that imports.
      - name: Smoke-test the frontend image
        if: steps.plan.outputs.retag != 'true' && matrix.service == 'frontend'
        run: |
          set -euo pipefail
          image=smoke:frontend
          uid=$(docker run --rm --entrypoint id "$image" -u)
          if [ "$uid" = "0" ]; then
            echo "::error::frontend runs as root"
            exit 1
          fi
          docker run --rm --entrypoint python "$image" -c '
          import client, components, projects, theme
          assert projects.API_URLS and projects.PROJECTS
          print("frontend modules import; backends wired:", len(projects.API_URLS))
          '

      - name: Build and push
        if: steps.plan.outputs.retag != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile.serve
          push: true
          # amd64 only -- see the note on the base image.
          platforms: linux/amd64
          # The frontend builds FROM python:3.11-slim directly -- it has no ML
          # dependencies -- so it takes no base image.
          build-args: |
            ${{ matrix.service != 'frontend'
                && format('BASE_IMAGE={0}/ai-residency-base-serve:sha-{1}', env.REGISTRY, github.sha)
                || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      # Server-side manifest copy: no build, no layer upload, both architectures. The
      # sha- tag ends up naming the identical image `latest` already pointed at, which
      # is the whole claim -- this service did not change, so its image did not either.
      - name: Retag the unchanged image
        if: steps.plan.outputs.retag == 'true'
        run: |
          set -euo pipefail
          image='${{ steps.image.outputs.name }}'
          docker buildx imagetools create -t "$image:sha-${{ github.sha }}" "$image:latest"
          echo "::notice::${{ matrix.service }} unchanged -- retagged rather than rebuilt"

  # A published image is the artifact people actually run, so it is the thing worth
  # scanning -- a lockfile audit misses everything the base OS contributes.
  #
  # Scans the serving base rather than all ten images: they share every layer below
  # their own source, so ten scans would report the same CVEs ten times.
  #
  # Results go to the job summary, not to the Security tab. Uploading SARIF is code
  # scanning, and code scanning on a *private* repository needs GitHub Advanced
  # Security -- without it the upload fails with "Resource not accessible by
  # integration" no matter what permissions the job declares. The scan itself ran fine;
  # only the upload could not work here. A summary table needs no entitlement, shows up
  # on the run page, and is the right shape for a report that informs rather than gates.
  #
  # If this repository ever goes public, swapping this for
  # github/codeql-action/upload-sarif gets the Security tab back.
  #
  # Reports rather than blocks (exit-code 0): a base-image CVE with no fix available
  # should be visible, not a merge gate. ignore-unfixed drops the ones nothing can be
  # done about.
  # Not on the publish path. Riding every push meant re-scanning an image that had
  # not changed, while a quiet week scanned nothing at all -- which is backwards,
  # because the thing a scan catches is a CVE *disclosed* after the image was built.
  # Weekly against `:latest` fixes both: it stops blocking merges, and it keeps
  # looking at the image people are actually running.
  scan:
    name: Scan the published base image
    needs: images-base
    if: >-
      always()
      && (github.event_name == 'schedule'
          || (needs.images-base.result == 'success' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/ai-residency-base-serve:${{ github.event_name == 'schedule' && 'latest' || format('sha-{0}', github.sha) }}
          format: table
          output: trivy.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Report
        run: |
          {
            echo "## Trivy — ai-residency-base-serve"
            echo
            echo "\`${{ github.event_name == 'schedule' && 'latest' || format('sha-{0}', github.sha) }}\` · CRITICAL and HIGH, fixable only."
            echo
            if [ -s trivy.txt ]; then
              echo '```'
              cat trivy.txt
              echo '```'
            else
              echo "No fixable CRITICAL or HIGH vulnerabilities."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
