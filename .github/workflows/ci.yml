# One workflow for the whole workspace.
#
# There was no CI in any of the eleven repos this replaced, and the reason was
# structural: ai-residency-common was a private git dependency, so every repo
# needed its own personal access token configured before it could even install.
# As a workspace member it needs no credential at all, and the only secrets here
# are the ones that publish images.
#
# Isolation comes from path filters rather than from separate repositories: a
# commit touching one service type-checks and tests that service. A commit touching
# libs/common checks everything, which is correct -- it is the one thing they
# genuinely share.
#
# Publishing follows the same filter. It did not always: every push to main once
# rebuilt all eleven images so that one `sha-<commit>` tag would name a complete set
# for deploy/ to pin. `deploy/images.yaml` names that set by digest now, which removed
# the reason -- an unchanged image needs no rebuild and no tag minted for a commit it
# had nothing to do with. Rebuilding everything was 78% of this repo's Actions minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Monday 04:00 UTC, for the vulnerability scan only -- every other job is gated
  # off `schedule`. A CVE disclosed against an image that has not changed is
  # invisible to a push-triggered scan.
  schedule:
    - cron: "0 4 * * 1"
  # Republish without inventing a commit. A dispatch selects every service,
  # since there is no diff to narrow it down.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: roshb

jobs:
  changes:
    name: Which members changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      members: ${{ steps.select.outputs.members }}
      services: ${{ steps.select.outputs.services }}
      any: ${{ steps.select.outputs.any }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7

      # dorny/paths-filter rather than a hand-rolled `git diff`. The diff itself is
      # the part that kept being subtly wrong: resolving a base SHA needs one rule
      # for pull_request (the merge base) and another for push (`github.event.before`,
      # which is all zeroes on a new branch), and the version of that logic written
      # here had already produced two bugs -- an empty diff killing the step under
      # `set -e`, and an empty selection serialising as `[""]`, a matrix with one
      # nameless entry. The action handles both events and exposes `changes` as a
      # JSON array of the filters that matched, which is the shape a matrix wants.
      #
      # The filters are listed rather than derived from the directory tree. That is a
      # deliberate trade: `test_ci_filters.py` fails if this list and the workspace
      # ever disagree, so a new member cannot be silently skipped -- and being written
      # down means the diff for adding one shows what will now run.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'libs/**'
              - 'uv.lock'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
              - 'Dockerfile.base'
              - 'Dockerfile.serve'
            common:
              - *shared
            vision-transformer:
              - *shared
            word2vec:
              - *shared
            speech:
              - *shared
            _template:
              - *shared
              - 'services/_template/**'
            word-embeddings:
              - *shared
              - 'services/word-embeddings/**'
            content-scoring:
              - *shared
              - 'services/content-scoring/**'
            vector-search-retrieval:
              - *shared
              - 'services/vector-search-retrieval/**'
            vit-classifier:
              - *shared
              - 'services/vit-classifier/**'
            vit-seq2seq:
              - *shared
              - 'services/vit-seq2seq/**'
            multimodal-captioning:
              - *shared
              - 'services/multimodal-captioning/**'
            whisper-fine-tuning:
              - *shared
              - 'services/whisper-fine-tuning/**'
            speech-emotion-recognition:
              - *shared
              - 'services/speech-emotion-recognition/**'
            rlhf-ppo:
              - *shared
              - 'services/rlhf-ppo/**'
            frontend:
              - *shared
              - 'services/frontend/**'

      # The filter names are basenames; the check matrix needs paths, and the publish
      # matrix needs service names without the libraries or the template. One jq pass
      # rather than three shell loops.
      - id: select
        env:
          MATCHED: ${{ steps.filter.outputs.changes }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          all_members=$(printf '%s\n' libs/*/ services/*/ | sed 's|/$||' | jq -R . | jq -sc .)
          if [ "$DISPATCH" = 'true' ]; then
            members="$all_members"
          else
            members=$(jq -nc --argjson matched "$MATCHED" --argjson all "$all_members" \
              '$all | map(select(. as $p | $matched | index($p | split("/") | last)))')
          fi
          # `_template` is checked like any other member -- it is a working service and
          # the seed for every new one -- but it is never published.
          services=$(jq -nc --argjson m "$members" \
            '$m | map(select(startswith("services/"))) | map(split("/") | last)
                | map(select(. != "_template"))')
          {
            echo "members=$members"
            echo "services=$services"
            echo "any=$(jq -nr --argjson m "$members" '$m | length > 0')"
          } >> "$GITHUB_OUTPUT"
          echo "Checked:   $(jq -r 'join(" ")' <<<"$members")"
          echo "Published: $(jq -r 'join(" ")' <<<"$services")"

  lint:
    name: Lint (whole workspace)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv stays on v7 deliberately. v8, v9 and v10 are three consecutive
      # breaking majors, and v9's break is that it caches far more aggressively --
      # billed cache usage, not a behaviour this repo asked for. Crossing three of
      # those is a migration to do on purpose, not a version bump to drift into.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .

      # compose/images.env is generated from deploy/images.yaml, and it is the only
      # generated deployment artifact left -- the chart reads the manifest directly as
      # a values overlay, so there is nothing to propagate into values.yaml and nothing
      # there that can disagree with it. Checked here rather than in the check matrix:
      # that matrix is per workspace member and deploy/ is not one, so a change to the
      # manifest tooling would otherwise be the one thing in the repo nothing runs.
      - name: The compose env file matches the manifest
        run: uv run python deploy/pin_images.py --check
      - name: Manifest tests
        run: uv run pytest -q deploy/

  # One job per workspace member -- libraries as well as services. `matrix.member` is
  # a path (libs/common, services/rlhf-ppo), and the package name is always
  # ai-residency-<basename>, which is what lets one matrix cover both.
  check:
    name: ${{ matrix.member }}
    needs: changes
    if: needs.changes.outputs.any == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.changes.outputs.members) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install this member only
        run: uv sync --frozen --package "ai-residency-$(basename ${{ matrix.member }})"

      # mypy runs from inside the member: each service has its own top-level
      # `config` package, so a single invocation across the tree sees several
      # modules named `config` and refuses to start.
      - name: Type-check
        working-directory: ${{ matrix.member }}
        run: uv run --project . mypy --config-file ../../pyproject.toml .

      # pytest exits 5 on "no tests collected", which is a fact about a service
      # rather than a failure. Every service has a suite now, including the frontend
      # -- its display helpers, project metadata and HTTP client live in Streamlit-free
      # modules precisely so they can be imported and asserted against here.
      - name: Test
        working-directory: ${{ matrix.member }}
        run: |
          if [ -d tests ]; then
            uv run --project . pytest -q
          else
            echo "::warning::${{ matrix.member }} has no tests/ directory"
          fi

  # The serving base, once, rather than rebuilt inside each of the ten service
  # jobs. Multi-arch: the runners are x86-64, but a reviewer on Apple Silicon --
  # and this project's own Kubernetes node -- are arm64, and an amd64-only image
  # fails there with "no matching manifest" rather than anything informative.
  # The arm64 half is QEMU-emulated, which is why the layer cache matters.
  images-base:
    name: Publish serving base
    needs: [changes, lint, check]
    # Publishing is gated on a repository variable, so it never happens by
    # accident. Training images are not built here: they carry the CUDA stack,
    # they are ~9GB, and amd64 is the only architecture a GPU box is. They have
    # their own on-demand workflow.
    #
    # `always()` with explicit result checks, not a bare `needs:`. A commit that
    # touches no service skips the `check` matrix entirely, and a skipped dependency
    # skips everything downstream by default -- so a docs-only commit to main would
    # publish nothing and leave a sha- tag that names no images. Publish whenever
    # nothing actually failed.
    if: |
      always()
      && needs.lint.result == 'success'
      && (needs.check.result == 'success' || needs.check.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && github.event_name != 'schedule'
      && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only when a shared input moved -- the manifest keeps the digest otherwise.
      - uses: docker/build-push-action@v7
        if: needs.changes.outputs.shared == 'true'
        with:
          context: .
          file: Dockerfile.base
          push: true
          # arm64 is emulated through QEMU here and is not free: measured at 8.4
          # minutes across a full eleven-image publish. It was dropped for that, and
          # restored once selective rebuilds made the number wrong -- a typical commit
          # rebuilds one image, so arm64 costs about fifty seconds, not eight minutes.
          #
          # What that buys: `docker run <image>` works on an Apple Silicon Mac. Docker
          # does not fall back to emulation when a manifest lacks the platform, it
          # refuses -- "no matching manifest for linux/arm64/v8" -- so amd64-only made
          # the first command in the README fail for most of its readers, and made
          # Docker Desktop's Kubernetes node (also arm64) unable to pull anything.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=base-serve
          cache-to: type=gha,scope=base-serve,mode=max
          tags: |
            ${{ env.REGISTRY }}/ai-residency-base-serve:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/ai-residency-base-serve:latest


  images:
    name: Publish ${{ matrix.service }}
    needs: [changes, images-base]
    # `success()`, and it has to stay that way. Every gate that decides whether this
    # repo publishes at all -- on main, not a schedule, PUBLISH_IMAGES set, lint and
    # check green -- is declared once, on images-base, and reaches this job only
    # through this line. `result != 'failure'` reads like a safe loosening and is not:
    # `skipped` passes it, and images-base is skipped on precisely the runs that must
    # not publish, so a pull request touching one service would push that service's
    # image, `:latest` included, from unmerged code.
    #
    # The skip-propagation problem the looser form was reaching for does not arise
    # here. images-base reports `success` when it runs with its build step skipped --
    # `if: needs.changes.outputs.shared == 'true'` is on the step, not the job -- so a
    # commit that rebuilds no base still leaves this job free to run.
    if: needs.images-base.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only what changed. `deploy/images.yaml` names the full set by digest, so an
        # unchanged image needs no rebuild and no tag minted for a commit it had
        # nothing to do with.
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The frontend's image has no -serve suffix: it is the only service with one
      # image rather than a serving/training pair.
      - name: Base image
        id: base
        run: |
          set -euo pipefail
          # By digest from the manifest, not by `sha-<commit>`: that tag exists only
          # when this commit rebuilt the base. The digest is always correct, and the
          # base a service was built against is then recorded rather than implied.
          if [ '${{ needs.changes.outputs.shared }}' = 'true' ]; then
            # The base was rebuilt in this run, and the manifest is not updated until
            # after these builds finish -- so the lock still names the *previous* base.
            # This commit's tag is the only correct reference here.
            echo "ref=${{ env.REGISTRY }}/ai-residency-base-serve:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            digest=$(cat deploy/base-image.digest)
            ref="${{ env.REGISTRY }}/ai-residency-base-serve@$digest"
            # Services are built for both architectures, so the base they build FROM
            # has to carry both. A single-platform base fails the arm64 leg with
            # "no match for platform in manifest", which names neither the base nor
            # the manifest entry that chose it. Checked here, where the fix is
            # obvious: rebuild the base, or push a commit that touches a shared input.
            # `--raw` rather than `--format`: a Go template's doubled braces are
            # ambiguous with the workflow expression syntax in this same file, and
            # both this shell and the Actions parser try to read them.
            platforms=$(docker buildx imagetools inspect --raw "$ref" \
              | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
            echo "base platforms: $platforms"
            for want in linux/amd64 linux/arm64; do
              case ",$platforms," in
                *",$want,"*) ;;
                *) echo "::error::the pinned base-serve digest has no $want; it has $platforms"; exit 1 ;;
              esac
            done
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "name=${{ env.REGISTRY }}/ai-residency-frontend" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ env.REGISTRY }}/ai-residency-${{ matrix.service }}-serve" >> "$GITHUB_OUTPUT"
          fi

      # `sha-<commit>` exists only for images this commit actually rebuilt, and that
      # is now fine: `deploy/images.yaml` names the set by digest, so an unchanged
      # image needs no tag minted for a commit it had nothing to do with. The tag is
      # how the manifest step finds what was just built.
      # Built into the runner's own docker first, native amd64 only, so the next step
      # has something to actually run. The multi-arch push happens after it passes --
      # a `push: true` build produces no local image to test, which is how this
      # pipeline came to publish images nothing had ever executed.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          # One root Dockerfile for every backend, selected by --build-arg. The
          # frontend is the exception: no torch base, no FastAPI app.
          file: ${{ matrix.service == 'frontend'
                    && 'services/frontend/Dockerfile.serve'
                    || 'Dockerfile.serve' }}
          load: true
          platforms: linux/amd64
          build-args: |
            SERVICE=${{ matrix.service }}
            ${{ matrix.service != 'frontend'
                && format('BASE_IMAGE={0}', steps.base.outputs.ref)
                || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          tags: smoke:${{ matrix.service }}

      # The check that would have caught the two most expensive mistakes available here.
      #
      # A `USER app` whose filesystem ownership is wrong builds perfectly and then fails
      # on the first write. A service that stops registering /ready builds perfectly and
      # then silently takes its whole fleet out of readiness, because a missing route
      # answers 404 and a 404 fails a readiness probe forever. Neither shows up in a
      # build log, a unit test, or a vulnerability scan.
      #
      # Deliberately does not start the server: several of these load multi-GB backbones
      # in their lifespan, which does not fit a runner. Importing the app and reading its
      # route table proves the contract is wired without paying for the weights.
      - name: Smoke-test the image
        if: matrix.service != 'frontend'
        run: |
          set -euo pipefail
          image=smoke:${{ matrix.service }}

          echo "::group::runs as a non-root user"
          uid=$(docker run --rm --entrypoint id "$image" -u)
          echo "uid=$uid"
          if [ "$uid" = "0" ]; then
            echo "::error::${{ matrix.service }} runs as root"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::the app exposes /health and /ready"
          docker run --rm --entrypoint python "$image" -c '
          from serving.api import app
          paths = {route.path for route in app.routes}
          missing = {"/health", "/ready"} - paths
          assert not missing, f"missing {missing}; has {sorted(paths)}"
          print("routes ok:", sorted(p for p in paths if p in {"/health", "/ready"}))
          '
          echo "::endgroup::"

          echo "::group::the working directory is writable by that user"
          docker run --rm --entrypoint sh "$image" -c 'touch ./.probe && rm ./.probe'
          echo "::endgroup::"

      # The frontend is a Streamlit app, not a FastAPI backend, so it gets the checks
      # that do apply to it: non-root, and a page flow that imports.
      - name: Smoke-test the frontend image
        if: matrix.service == 'frontend'
        run: |
          set -euo pipefail
          image=smoke:frontend
          uid=$(docker run --rm --entrypoint id "$image" -u)
          if [ "$uid" = "0" ]; then
            echo "::error::frontend runs as root"
            exit 1
          fi
          docker run --rm --entrypoint python "$image" -c '
          from importlib import import_module
          import client, components, projects, shared, theme
          assert projects.API_URLS and projects.PROJECTS
          # Every page resolves. app.py imports these by name at boot, so a view
          # module that is missing or does not define render() is a container that
          # starts and then fails on the first request for that page.
          for service in projects.ALL_PAGES:
              module = import_module(f"views.{service.replace(chr(45), chr(95))}")
              assert callable(module.render), f"views/{service} has no render()"
          print("frontend imports; pages wired:", len(projects.ALL_PAGES))
          '

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # One root Dockerfile for every backend, selected by --build-arg. The
          # frontend is the exception: no torch base, no FastAPI app.
          file: ${{ matrix.service == 'frontend'
                    && 'services/frontend/Dockerfile.serve'
                    || 'Dockerfile.serve' }}
          push: true
          # Both architectures -- see the note on the base image.
          platforms: linux/amd64,linux/arm64
          # The frontend builds FROM python:3.11-slim directly -- it has no ML
          # dependencies -- so it takes no base image.
          build-args: |
            SERVICE=${{ matrix.service }}
            ${{ matrix.service != 'frontend'
                && format('BASE_IMAGE={0}', steps.base.outputs.ref)
                || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest


  # The manifest is the deployment artifact, so CI writes it rather than a human
  # remembering to. Only images this commit rebuilt need resolving -- everything else
  # keeps the digest it already has, which is exactly why nothing needs retagging.
  #
  # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop; the
  # [skip ci] is belt-and-braces for anyone who swaps in a PAT later.
  lock:
    name: Update the image manifest
    needs: [changes, images-base, images]
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && github.event_name != 'schedule'
      && needs.images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/login-action@v4
        with:
          username: ${{ env.REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve digests and propagate
        run: |
          set -euo pipefail
          # An array, so the service list stays word-split on purpose while
          # everything else here keeps its quoting.
          read -r -a rebuilt <<<"$(jq -r 'join(" ")' <<<'${{ needs.changes.outputs.services }}')"
          if [ '${{ needs.changes.outputs.shared }}' = 'true' ]; then
            rebuilt=(base-serve "${rebuilt[@]}")
          fi
          echo "rebuilt: ${rebuilt[*]:-nothing}"
          python3 deploy/pin_images.py --update "${rebuilt[@]}" --sha '${{ github.sha }}'

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add deploy/`, not a list of paths. It is three files now -- the
          # manifest, the base digest and the compose env file -- and naming them was
          # how one got left unstaged, producing a partial commit whose only symptom was
          # the next run's `--check` failing on drift with no obvious cause.
          git add deploy/
          git commit -m "Update the image manifest for ${GITHUB_SHA::7} [skip ci]"
          git push
          echo "::notice::deploy/images.yaml updated"

  # A published image is the artifact people actually run, so it is the thing worth
  # scanning -- a lockfile audit misses everything the base OS contributes.
  #
  # Scans the serving base rather than all ten images: they share every layer below
  # their own source, so ten scans would report the same CVEs ten times.
  #
  # Results go to the job summary, not to the Security tab. Uploading SARIF is code
  # scanning, and code scanning on a *private* repository needs GitHub Advanced
  # Security -- without it the upload fails with "Resource not accessible by
  # integration" no matter what permissions the job declares. The scan itself ran fine;
  # only the upload could not work here. A summary table needs no entitlement, shows up
  # on the run page, and is the right shape for a report that informs rather than gates.
  #
  # If this repository ever goes public, swapping this for
  # github/codeql-action/upload-sarif gets the Security tab back.
  #
  # Reports rather than blocks (exit-code 0): a base-image CVE with no fix available
  # should be visible, not a merge gate. ignore-unfixed drops the ones nothing can be
  # done about.
  # Whenever the base is actually rebuilt, *and* weekly. The two answer different
  # questions: the first asks whether this change introduced something, the second
  # whether anything has been disclosed against what was already shipped -- and only
  # that one catches a CVE published against an image untouched for months, which is
  # the normal state of this repo between bursts of work.
  #
  # The base is rebuilt only when a shared input moves, so the push arm no longer
  # fires on every commit. That is the right shape: rescanning a byte-identical image
  # on a docs commit told us nothing the weekly run does not. Together, roughly 55
  # job-minutes a year.
  scan:
    name: Scan the published base image
    needs: [changes, images-base]
    # The push arm needs the base to have actually been *rebuilt*, not merely for
    # images-base to have reported success. Its build step is conditional on a shared
    # input moving, so on a service-only push the job succeeds having pushed nothing
    # and `sha-<commit>` is a tag that was never created -- Trivy then fails resolving
    # the image, which `exit-code: 0` does not suppress because that only covers
    # findings, not a pull error.
    if: >-
      always()
      && (
        github.event_name == 'schedule'
        || (needs.images-base.result == 'success' && needs.changes.outputs.shared == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/ai-residency-base-serve:${{ github.event_name == 'schedule' && 'latest' || format('sha-{0}', github.sha) }}
          format: table
          output: trivy.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Report
        run: |
          {
            echo "## Trivy — ai-residency-base-serve"
            echo
            echo "\`${{ github.event_name == 'schedule' && 'latest' || format('sha-{0}', github.sha) }}\` · CRITICAL and HIGH, fixable only."
            echo
            if [ -s trivy.txt ]; then
              echo '```'
              cat trivy.txt
              echo '```'
            else
              echo "No fixable CRITICAL or HIGH vulnerabilities."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
