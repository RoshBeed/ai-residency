[project]
name = "ai-residency-vision-transformer"
version = "0.1.0"
description = "Transformer building blocks written from scratch: attention, encoder, decoder, patch embedding, positional encoding"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RoshBeed" }]
dependencies = [
    "torch>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Both blocks are required. `packages.find` alone silently builds an empty wheel.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["vision_transformer*"]

[tool.setuptools.package-data]
vision_transformer = ["py.typed"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
