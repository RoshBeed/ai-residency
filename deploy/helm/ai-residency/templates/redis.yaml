{{- /*
week2's own HNSW retrieval index -- ephemeral, no PVC, matching docker-compose's
`--save "" --appendonly no` (ephemeral by design there too). Not bound to a host port
or LoadBalancer -- only week2's own pod needs to reach this, over the cluster's
internal DNS (service name "week2-redis"), same as it was compose-internal-only there.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: week2-redis
  labels:
    {{- include "ai-residency-hub.labels" . | nindent 4 }}
    app.kubernetes.io/name: week2-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: week2-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: week2-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ .Values.redis.command | toJson }}
          ports:
            - containerPort: {{ .Values.redis.port }}
          {{- if or .Values.redis.memoryRequest .Values.redis.memoryLimit }}
          resources:
            {{- if .Values.redis.memoryRequest }}
            requests:
              memory: {{ .Values.redis.memoryRequest }}
            {{- end }}
            {{- if .Values.redis.memoryLimit }}
            limits:
              memory: {{ .Values.redis.memoryLimit }}
            {{- end }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.serviceName }}
  labels:
    {{- include "ai-residency-hub.labels" . | nindent 4 }}
    app.kubernetes.io/name: week2-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: week2-redis
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
