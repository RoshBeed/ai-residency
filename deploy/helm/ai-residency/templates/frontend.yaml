{{- /*
<KEY>_API_URL env vars are generated from .Values.backends' keys, not hardcoded --
adding a 7th backend to values.yaml automatically wires the frontend to it, same as
docker-compose.yml's explicit (hand-written) WEEK1_API_URL..WEEK6_API_URL block does
today, just data-driven instead of copy-pasted. Hyphens in a key (word-embeddings)
become underscores in the env var name so the frontend's os.getenv still matches.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "ai-residency.labels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
          {{- if .Values.probes.enabled }}
          # Streamlit's own health endpoint, not /health -- the frontend is a Streamlit
          # app, not one of the FastAPI backends. It starts in seconds (no model to load),
          # so this needs a far smaller startup budget than the backends.
          startupProbe:
            httpGet:
              path: {{ .Values.frontend.healthPath }}
              port: {{ .Values.frontend.containerPort }}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.healthPath }}
              port: {{ .Values.frontend.containerPort }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.healthPath }}
              port: {{ .Values.frontend.containerPort }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if or .Values.frontend.memoryRequest .Values.frontend.memoryLimit }}
          resources:
            {{- if .Values.frontend.memoryRequest }}
            requests:
              memory: {{ .Values.frontend.memoryRequest }}
            {{- end }}
            {{- if .Values.frontend.memoryLimit }}
            limits:
              memory: {{ .Values.frontend.memoryLimit }}
            {{- end }}
          {{- end }}
          env:
            {{- range $name := (keys .Values.backends | sortAlpha) }}
            - name: {{ upper (replace "-" "_" $name) }}_API_URL
              value: "http://{{ $name }}:{{ (index $.Values.backends $name).containerPort }}"
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "ai-residency.labels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: {{ .Values.frontend.servicePort }}
      targetPort: {{ .Values.frontend.containerPort }}
