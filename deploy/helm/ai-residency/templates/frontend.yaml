{{- /*
<KEY>_API_URL env vars are generated from .Values.backends' keys, not hardcoded --
adding a 7th backend to values.yaml automatically wires the frontend to it, same as
docker-compose.yml's explicit (hand-written) <SERVICE>_API_URL block does
today, just data-driven instead of copy-pasted. Hyphens in a key (word-embeddings)
become underscores in the env var name so the frontend's os.getenv still matches.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "ai-residency.labels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      {{- include "ai-residency.podSecurityContext" . | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ include "ai-residency.image" (dict "spec" .Values.frontend "ctx" . "name" "frontend") }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "ai-residency.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
          {{- if .Values.probes.enabled }}
          # Streamlit's own health endpoint, not /health -- the frontend is a Streamlit
          # app, not one of the FastAPI backends. It starts in seconds (no model to load),
          # so this needs a far smaller startup budget than the backends.
          startupProbe:
            httpGet:
              path: {{ .Values.frontend.healthPath }}
              port: {{ .Values.frontend.containerPort }}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.healthPath }}
              port: {{ .Values.frontend.containerPort }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.healthPath }}
              port: {{ .Values.frontend.containerPort }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- include "ai-residency.resources" (dict "ctx" . "spec" .Values.frontend) | nindent 10 }}
          env:
            {{- range $name := (keys .Values.backends | sortAlpha) }}
            - name: {{ upper (replace "-" "_" $name) }}_API_URL
              value: "http://{{ $name }}:{{ (index $.Values.backends $name).containerPort | default $.Values.backendDefaults.containerPort }}"
            {{- end }}
            # Which pages the UI shows. Derived from the backends this release
            # actually deploys, so trimming .Values.backends to one service gives a UI
            # for that service rather than a hub with eight dead pages -- the same
            # thing `make up SERVICES=...` does for compose. `frontend.pages` overrides
            # it for the case where every backend is deployed but the UI should show
            # fewer. No backend contains any UI either way.
            - name: AI_RESIDENCY_PAGES
              value: "{{ join " " (default (keys .Values.backends | sortAlpha) .Values.frontend.pages) }}"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "ai-residency.labels" . | nindent 4 }}
    app.kubernetes.io/name: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: {{ .Values.frontend.servicePort }}
      targetPort: {{ .Values.frontend.containerPort }}
