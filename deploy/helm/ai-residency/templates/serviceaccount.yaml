{{- /*
One ServiceAccount for the whole release, with the API token *not* mounted.

Nothing in this chart talks to the Kubernetes API: the backends serve HTTP, the training
Jobs push to the Hugging Face Hub. Running them on `default` with an auto-mounted token
hands every pod a credential it never uses, which is exactly the credential an attacker
who lands in one of these containers would go looking for.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "ai-residency.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
