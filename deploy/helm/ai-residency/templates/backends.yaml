{{- /*
One Deployment + one ClusterIP Service per entry in .Values.backends. Service names
are deliberately left as the plain map key (word-embeddings, vit-classifier, ...) rather than
Helm's usual release-prefixed fullname, so they resolve exactly like docker-compose's own
service-name DNS did, and so the frontend's <KEY>_API_URL env vars (see frontend.yaml)
need no per-service special-casing. This assumes one release per namespace, same as
the docker-compose file assumes one stack per compose project.
*/ -}}
{{- range $name, $svc := .Values.backends }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-residency.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. A rolling update brings the replacement pod
  # up *before* retiring the old one, so the node briefly needs two copies' worth of
  # memory. These pods request 1.5-6GiB each and the whole set already sits close to a
  # single node's allocatable, so the surge pod has nowhere to go, stays Pending, and the
  # old pod is never retired to make room -- the rollout deadlocks instead of finishing.
  # Trading a few seconds of downtime per deploy for a rollout that terminates is the
  # right call on a single-node cluster; on a real multi-node one, drop this.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- if $.Values.serviceAccount.create }}
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      {{- end }}
      {{- include "ai-residency.podSecurityContext" $ | nindent 6 }}
      {{- if or $svc.waitForRedis $svc.bootstrapCommand }}
      initContainers:
        {{- if $svc.waitForRedis }}
        - name: wait-for-redis
          image: "{{ $.Values.redis.image }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- include "ai-residency.containerSecurityContext" $ | nindent 10 }}
          command:
            - sh
            - -c
            - |
              until redis-cli -h {{ $.Values.redis.serviceName }} -p {{ $.Values.redis.port }} ping; do
                echo "waiting for {{ $.Values.redis.serviceName }}...";
                sleep 2;
              done
        {{- end }}
        {{- if $svc.bootstrapCommand }}
        - name: bootstrap-index
          image: "{{ include "ai-residency.image" (dict "spec" $svc "ctx" $) }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- include "ai-residency.containerSecurityContext" $ | nindent 10 }}
          {{- if $svc.bootstrapOptional }}
          # Populating the index is a convenience, not a precondition for serving: the
          # API degrades to "not ready, retry per request" on its own when the artifacts
          # are missing, which is exactly what it does under docker-compose. An init
          # container that exits non-zero, though, is fatal -- the pod never starts and
          # CrashLoopBackOffs indefinitely, so a missing optional artifact took the whole
          # service down under Kubernetes while the identical image stayed up under
          # compose. Swallow the failure and let the app make that call instead.
          command:
            - sh
            - -c
            - |
              {{ $svc.bootstrapCommand | join " " }} || \
                echo "bootstrap-index: skipped, artifacts unavailable -- the API will start and retry per request"
          {{- else }}
          command: {{ $svc.bootstrapCommand | toJson }}
          {{- end }}
          {{- if or $.Values.secrets.hfToken $.Values.secrets.wandbApiKey }}
          envFrom:
            - secretRef:
                name: {{ $.Values.secrets.name }}
                optional: true
          {{- end }}
          {{- if $svc.env }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ tpl ($v | toString) $ | quote }}
            {{- end }}
          {{- end }}
          {{- if $svc.volumes }}
          volumeMounts:
            {{- range $vol := $svc.volumes }}
            - name: {{ $vol.name }}
              mountPath: {{ $vol.mountPath }}
              {{- if $vol.readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ include "ai-residency.image" (dict "spec" $svc "ctx" $) }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- include "ai-residency.containerSecurityContext" $ | nindent 10 }}
          ports:
            - containerPort: {{ $svc.containerPort }}
          {{- if $.Values.probes.enabled }}
          # Two endpoints, two meanings -- and they must not be the same URL.
          #
          # /health is liveness: the process is up. It answers 200 unconditionally, so a
          # model that is slow to load, or absent entirely, never gets a pod restarted.
          #
          # /ready is readiness: this pod can answer a real request. It answers 503 while
          # the weights are missing, which is what takes the pod out of the Service's
          # endpoints instead of routing traffic to a backend that can only 503 back.
          #
          # Pointing both at /health -- which is what this chart used to do -- makes the
          # readiness probe decorative: it cannot fail, so an unusable pod is marked Ready
          # and gets traffic anyway, the exact failure the probe exists to prevent. The
          # liveness probe had the mirror problem: a wedged model still answered 200, so it
          # could never be restarted.
          #
          # startupProbe covers the cold start on its own budget (a backend may pull weights
          # from the Hub first) and suppresses liveness while it runs, so a slow-but-healthy
          # load is not mistaken for a hang.
          startupProbe:
            httpGet:
              path: {{ $svc.healthPath | default $.Values.probes.healthPath }}
              port: {{ $svc.containerPort }}
            periodSeconds: {{ $.Values.probes.startup.periodSeconds }}
            failureThreshold: {{ $.Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $svc.readyPath | default $.Values.probes.readyPath }}
              port: {{ $svc.containerPort }}
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath | default $.Values.probes.healthPath }}
              port: {{ $svc.containerPort }}
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- include "ai-residency.resources" (dict "ctx" $ "spec" $svc) | nindent 10 }}
          {{- if or $.Values.secrets.hfToken $.Values.secrets.wandbApiKey }}
          envFrom:
            # optional: a release installed without credentials still starts, and its
            # backends serve whatever weights the hostPath mounts happen to hold.
            - secretRef:
                name: {{ $.Values.secrets.name }}
                optional: true
          {{- end }}
          {{- if $svc.env }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ tpl ($v | toString) $ | quote }}
            {{- end }}
          {{- end }}
          {{- if $svc.volumes }}
          volumeMounts:
            {{- range $vol := $svc.volumes }}
            - name: {{ $vol.name }}
              mountPath: {{ $vol.mountPath }}
              {{- if $vol.readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
          {{- end }}
      {{- if $svc.volumes }}
      volumes:
        {{- range $vol := $svc.volumes }}
        - name: {{ $vol.name }}
          {{- include "ai-residency.volumeSource" (dict "ctx" $ "vol" $vol) | nindent 10 }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-residency.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.containerPort }}
      targetPort: {{ $svc.containerPort }}
---
{{- end }}
