{{- /*
Credentials for the backends and the training Jobs.

Both are optional. Without HF_TOKEN a backend can only serve weights that are already
on the node (the hostPath mounts below); with it, a backend whose mount is empty --
or absent entirely -- pulls its checkpoint from the Hub instead, which is what lets
this chart deploy somewhere that never trained anything.

The values are deliberately not in values.yaml. `make helm-install` / `helm-upgrade`
pass them with --set-string from the shell, which has already loaded ../.env, so no
committed file in this repo ever contains a token.
*/ -}}
{{- if or .Values.secrets.hfToken .Values.secrets.wandbApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "ai-residency.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.hfToken }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
  {{- end }}
  {{- if .Values.secrets.wandbApiKey }}
  WANDB_API_KEY: {{ .Values.secrets.wandbApiKey | quote }}
  {{- end }}
{{- end }}
