# Default values for ai-residency.
#
# The Kubernetes analog of this repo's own docker-compose.yml. Both bring up the nine
# backends, Redis and the frontend from the same images; this adds what compose has no
# equivalent for -- probes, resource requests, and a security context.
#
# Nothing here mounts a checkpoint. Every runtime is ephemeral: a container, a CI runner
# and a rented GPU box all start with an empty disk, so each service resolves its weights
# from the Hugging Face Hub at startup. The model and dataset repos are public, so a
# release installed with no credentials at all still comes up and serves.

# The Hugging Face model cache on the *node's* filesystem, mounted by the three services
# whose backbones are large enough that re-downloading them on every pod restart hurts.
# It is a convenience, not a dependency -- an empty cache just means a slower cold start.
#
# This is a hostPath, which ties those three to a single-node cluster (it is verified
# against Docker Desktop's built-in Kubernetes, whose node filesystem is the Mac's).
# On a real multi-node cluster, point them at a PersistentVolumeClaim instead:
#   --set hfCache.mode=pvc --set hfCache.claimName=<your-claim>
hfCache:
  # "hostPath" (single-node, the default) or "pvc" (any cluster), or "none" to run with
  # no cache at all and let every pod download its own copy.
  mode: hostPath
  hostPath: /Users/rosh/.cache/huggingface
  claimName: ""

image:
  # Images are pulled from Docker Hub under `roshb` (Docker Hub account). That is a
  # different account from `roshbeed` (Hugging Face), which owns the model and dataset
  # repos -- the two are not interchangeable.
  #
  # Locally-built images are NOT visible to this cluster. Docker Desktop's Kubernetes
  # runs the node as a kind container with its own containerd image store, so a
  # `docker build` on the host reaches dockerd and nothing else -- and IfNotPresent
  # then keeps serving whatever the node already had, silently, with no error and no
  # sign in `kubectl describe` that the image is stale. Import them explicitly with
  # `make load-images` after every rebuild.
  pullPolicy: IfNotPresent
  # Pinned to a commit rather than `latest`: one tag names the exact set built
  # and verified together. `--set image.tag=latest` tracks the tip instead.
  tag: sha-8e0e1c1c09db44cede681e639d673c9a1719c74e

# Credentials, mounted into every backend and every training Job as environment.
# Deliberately empty here: `make helm-install` / `helm-upgrade` fill them with
# --set-string from the shell (which has already loaded ../.env), so no committed
# file in this repo holds a token. A release installed without them still works --
# backends then serve only what the hostPath mounts below already contain.
secrets:
  name: ai-residency-credentials
  hfToken: ""
  wandbApiKey: ""

# Training runs as opt-in Jobs rather than as part of a normal install, so
# `helm upgrade` after an image rebuild never silently starts one.
#
#   make helm-train                 # smoke-scale, the default overrides below
#   helm upgrade ... --set train.enabled=true --set train.env.AI_RESIDENCY_NUM_EPOCHS=50
#
train:
  enabled: false
  # Restrict to one backend by name. Six training Jobs plus eight serving pods does
  # not fit on a single node, so this is the normal way to use it.
  only: ""
  # Suffixes the Job name. A Job's pod template is immutable, so re-running with the
  # same name fails rather than starting a second run; vary this per run.
  runName: "1"
  # AI_RESIDENCY_* overrides are read by every repo's Config (see ai-residency-common's BaseConfig), so
  # a run can be shortened here without touching any repo's source.
  env:
    AI_RESIDENCY_NUM_EPOCHS: "1"
    LOG_LEVEL: "INFO"

# Liveness/readiness/startup probes for every backend and the frontend. Compose has no
# equivalent, so this is Kubernetes-specific.
#
# The two paths are deliberately different endpoints, and that is the whole point.
# /health is liveness and always answers 200 -- a model that is slow to load, or missing,
# must not get a pod restarted. /ready answers 503 until the service can actually serve,
# so an unusable pod is kept out of its Service's endpoints instead of being sent traffic
# it can only 503 back. Pointing both at /health gives you a readiness probe that cannot
# fail, which is the same as having no readiness probe at all.
#
# The startup budget is deliberately generous (10s x 60 = up to 10 minutes): a cold
# start may pull weights from the Hugging Face Hub before the app can serve. While the
# startupProbe is running Kubernetes suppresses the liveness probe, so a slow-but-fine
# model load can't be mistaken for a hang and restarted in a loop.
probes:
  enabled: true
  healthPath: /health
  readyPath: /ready
  startup:
    periodSeconds: 10
    failureThreshold: 60
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# Nothing here talks to the Kubernetes API, so no pod needs a mounted API token.
serviceAccount:
  create: true
  name: ai-residency

# Restricts who may reach the backends and Redis. Inert on a cluster whose CNI does not
# enforce NetworkPolicy (Docker Desktop's does not), so it costs nothing to leave on.
networkPolicy:
  enabled: true

# Applied to every pod and every container in this chart -- backends, frontend, Redis,
# the init containers and the training Jobs.
#
# Nothing here needs root: each image runs a Python process that reads its own code and
# writes to a cache directory. Running as root anyway is the default only because it is
# the default, and it is the first thing any cluster with Pod Security Standards
# enforced will reject.
#
# readOnlyRootFilesystem is off: the Hugging Face client writes its cache, and several
# services write temp files for ffmpeg. Confining those to an emptyDir and turning this
# on is the next step, not a blocker for dropping root.
securityContext:
  enabled: true
  pod:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    # Makes every mounted volume group-writable by the pod's fsGroup, which is what lets
    # a non-root UID write the HF cache it was previously writing as root.
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

frontend:
  image: roshb/ai-residency-frontend
  containerPort: 8501
  servicePort: 8500
  # Streamlit's own health endpoint -- the frontend is not a FastAPI backend and has
  # no /health of its own.
  healthPath: /_stcore/health
  cpuRequest: 100m
  memoryRequest: 512Mi
  memoryLimit: 768Mi
  service:
    # Docker Desktop's Kubernetes auto-binds LoadBalancer services to localhost, so
    # this alone gets you http://localhost:8500 with no port-forward needed -- same
    # convenience docker-compose's "ports: 8500:8501" already gave you.
    type: LoadBalancer

redis:
  # Pinned, like every other image here: `latest` silently changes what a release
  # brings up between two installs of the same chart version.
  image: redis/redis-stack-server:7.4.0-v3
  command: ["redis-stack-server", "--save", "", "--appendonly", "no"]
  port: 6379
  serviceName: redis
  cpuRequest: 50m
  memoryRequest: 128Mi
  memoryLimit: 256Mi

# One entry per backend. Keys become both the Deployment/Service name *and* the
# frontend's <KEY>_API_URL env var name (uppercased) -- matches docker-compose's own
# service-name-as-DNS-name convention exactly, so the frontend's env vars need no
# per-service special-casing.
#
# memoryRequest is set on every backend (a Kubernetes-specific addition -- compose has
# no equivalent) for a reason found empirically on first install: with no requests set,
# an OOM-killed pod is immediately recreated by the Deployment's default
# restartPolicy: Always, immediately re-competes for the same scarce memory, and is
# OOM-killed again -- an infinite crash loop across *all* pods, and a worse failure mode
# than compose's (where an OOM-killed container simply stays stopped). Requests make the
# scheduler refuse to place what does not fit, so a pod sits Pending instead of the whole
# set thrashing.
#
# The numbers below are measured, not estimated: each pod's cgroup peak
# (/sys/fs/cgroup/memory.peak) was read after the service had loaded its models and
# answered a real request. Re-measure rather than guess if a model changes:
#
#   kubectl exec -n ai-residency <pod> -- \
#     sh -c 'echo $(( $(cat /sys/fs/cgroup/memory.peak) / 1048576 ))Mi'
#
#   frontend 379Mi                 word-embeddings 2286Mi     content-scoring 1345Mi
#   vector-search-retrieval 294Mi  vit-classifier 447Mi       vit-seq2seq 447Mi
#   multimodal-captioning 5410Mi   whisper-fine-tuning 1845Mi rlhf-ppo 4640Mi
#   redis 12Mi
#
# Requests are the peak rounded up, and they sum to 21632Mi (~21.1GiB) across all
# eleven pods. That is the number that has to fit: this host reports 23.4GiB
# allocatable, so everything schedules, with little to spare. Read the real figure
# rather than trusting one written here, since it moves whenever Docker Desktop's
# memory slider does:
# `kubectl get node -o jsonpath='{.items[0].status.allocatable.memory}'`
#
# cpuRequest is set too, and deliberately low. It is not a measurement -- these are
# bursty inference pods that idle near zero and spike to a full core for the length of
# one request. The request is what the scheduler reserves and what decides who gets
# throttled under contention; setting it to the burst would leave the node unschedulable
# for a load that almost never happens. No CPU *limit* is set anywhere on purpose: a CPU
# limit throttles rather than kills, and throttling a model mid-inference turns a fast
# request into a slow one for no benefit on a single-tenant node.
#
# memoryLimit is also set on every container (requests alone gate scheduling, not
# runtime usage). Limits sit ~40% above the measured peak. That headroom is the point:
# multimodal-captioning's limit was previously 6144Mi against a real peak of 5410Mi -- 12% of slack --
# and it was OOMKilled in normal use. Limits may sum past allocatable; unlike requests
# they are a burst ceiling, not a reservation.
backends:
  # --- CBOW vectors: nearest-neighbour and analogy lookup ---
  word-embeddings:
    image: roshb/ai-residency-word-embeddings-serve
    trainImage: roshb/ai-residency-word-embeddings-train
    trainCommand: ["python", "-m", "word_embeddings.train"]
    containerPort: 8000
    cpuRequest: 100m
    memoryRequest: 2560Mi
    memoryLimit: 3584Mi
    env: {}

  # --- The regression head over those frozen vectors ---
  content-scoring:
    image: roshb/ai-residency-content-scoring-serve
    trainImage: roshb/ai-residency-content-scoring-train
    trainCommand: ["python", "-m", "content_scoring.train"]
    containerPort: 8000
    cpuRequest: 100m
    memoryRequest: 1536Mi
    memoryLimit: 2048Mi
    env: {}

  # --- Dual-encoder retrieval: the one backend that needs Redis (HNSW index) ---
  vector-search-retrieval:
    image: roshb/ai-residency-vector-search-retrieval-serve
    trainImage: roshb/ai-residency-vector-search-retrieval-train
    # The encoder towers. The CBOW and triples stages need their own data prep.
    trainCommand: ["python", "-m", "models.training"]
    containerPort: 8000
    cpuRequest: 100m
    memoryRequest: 512Mi
    memoryLimit: 1024Mi
    # Blocks on redis actually accepting connections before the app container
    # starts -- compose's own `depends_on: [redis]` only orders container start,
    # not readiness, but Kubernetes has no ordering primitive at all by default, so this
    # closes a real race that compose's (weaker) guarantee otherwise narrowed.
    waitForRedis: true
    # Runs once at pod startup, after Redis is confirmed reachable, and populates the
    # HNSW index from the MS MARCO corpus so /query works without a manual bootstrap step.
    bootstrapCommand:
      - uv
      - run
      - python
      - -m
      - retrieval.save_doc_embeddings_to_redis
    # Never let a failed index bootstrap keep the pod from starting -- see the comment
    # on the init container in templates/backends.yaml.
    bootstrapOptional: true
    env:
      # Templated against .Values.redis.serviceName (rendered via `tpl` in
      # backends.yaml) rather than hardcoded, so overriding the redis service name
      # doesn't silently break DNS resolution here.
      REDIS_HOST: "{{ .Values.redis.serviceName }}"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
    # No data volume either: the vocabulary and tokenized triples come from this
    # service's Hugging Face dataset repo, resolved at run time like the weights.

  # --- Single-digit ViT classifier (Dockerfile.serve) ---
  vit-classifier:
    image: roshb/ai-residency-vit-classifier-serve
    trainImage: roshb/ai-residency-vit-classifier-train
    # The epoch cap is its own field, so train.env's AI_RESIDENCY_NUM_EPOCHS alone would
    # not shorten a run. trainEnv is merged in after train.env, so it can override.
    trainEnv:
      AI_RESIDENCY_CLASSIFIER_EPOCHS: "1"
    trainCommand: ["python", "-m", "vit_classifier.trainer"]
    containerPort: 8000
    cpuRequest: 100m
    memoryRequest: 512Mi
    memoryLimit: 1024Mi
    env: {}

  # --- Multi-digit encoder-decoder ViT (Dockerfile.serve) ---
  vit-seq2seq:
    image: roshb/ai-residency-vit-seq2seq-serve
    trainImage: roshb/ai-residency-vit-seq2seq-train
    trainCommand: ["python", "-m", "vit_seq2seq.trainer"]
    containerPort: 8000
    cpuRequest: 100m
    memoryRequest: 512Mi
    memoryLimit: 1024Mi
    env: {}

  # --- Multimodal captioning: CLIP -> adapter -> Qwen3 ---
  multimodal-captioning:
    image: roshb/ai-residency-multimodal-captioning-serve
    trainImage: roshb/ai-residency-multimodal-captioning-train
    trainCommand: ["python", "-m", "multimodal_captioning.training"]
    containerPort: 8000
    cpuRequest: 100m
    memoryRequest: 6144Mi
    memoryLimit: 7680Mi
    env:
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - name: hf-cache
        mountPath: /home/app/.cache/huggingface
        kind: hfCache

  # --- Whisper fine-tuning ---
  whisper-fine-tuning:
    image: roshb/ai-residency-whisper-fine-tuning-serve
    trainImage: roshb/ai-residency-whisper-fine-tuning-train
    trainCommand: ["python", "-m", "whisper_fine_tuning.training"]
    containerPort: 8000
    cpuRequest: 100m
    memoryRequest: 2048Mi
    memoryLimit: 2816Mi
    env: {}

  # --- Emotion-aware Whisper (Dockerfile.serve) ---
  speech-emotion-recognition:
    image: roshb/ai-residency-speech-emotion-recognition-serve
    trainImage: roshb/ai-residency-speech-emotion-recognition-train
    trainCommand: ["python", "-m", "speech_emotion_recognition.training"]
    containerPort: 8000
    cpuRequest: 100m
    memoryRequest: 2048Mi
    memoryLimit: 2816Mi
    env: {}
    volumes:
      - name: hf-cache
        mountPath: /home/app/.cache/huggingface
        kind: hfCache

  # --- RLHF / PPO ---
  rlhf-ppo:
    image: roshb/ai-residency-rlhf-ppo-serve
    trainImage: roshb/ai-residency-rlhf-ppo-train
    # One PPO step -- this repo has no epoch loop, by design.
    trainCommand: ["python", "-m", "training.run_ppo"]
    containerPort: 8000
    # Three SmolLM2-135M copies (~270MB each) + DeBERTa reward model (~1.2GB)
    # ≈ 2GB of weights. Peak during PPO step ~4-5GB with activations.
    cpuRequest: 100m
    memoryRequest: 5120Mi
    memoryLimit: 6656Mi
    env:
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      # The HF model cache so a pod restart (OOM or otherwise) does not force a fresh
      # download of SmolLM2-135M + the DeBERTa reward model on every cold start. Also
      # needed because this pod has no other way to persist the cache: the container
      # filesystem is ephemeral.
      - name: hf-cache
        mountPath: /home/app/.cache/huggingface
        kind: hfCache
