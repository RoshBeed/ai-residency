# Every backend and the frontend, in one stack.
#
# Images are pulled as roshb/ai-residency-<service>-serve:latest (or -train),
# built and pushed from the repository root with `make build SERVICE=<name>` and
# `make push SERVICE=<name>`.
#
# There are no checkpoint mounts. The runtime is ephemeral -- a container, a CI
# runner and a rented GPU box all start with an empty disk -- so every service
# resolves its weights from the Hugging Face Hub at startup and training pushes
# them back. A path that works only because a file happens to sit on one machine
# is not a deployment, and the mounts that used to be here hid exactly that.
#
# HF_TOKEN is optional and only needed for *pushing*. The model and dataset repos
# are public, so `docker compose up` on a machine with no credentials at all pulls
# what it needs and serves.
#
# `train` services are profile-gated, so a bare `docker compose up` never trains.
#
# Serving images are pinned by digest from deploy/images.yaml, so `docker compose up`
# a month from now brings up exactly what it brought up today. The digests come from
# compose/images.env, which `make -C deploy pin-images` generates; the `${..._REF}`
# references below are what read it, and fall back to `:latest` when it is absent.
#
# Training images are not in that manifest: they are ~9GB, built on demand by a
# separate workflow, and nothing regenerates a digest for them. They track
# `TRAIN_IMAGE_TAG`, which defaults to `latest` -- the tag that workflow pushes
# alongside its sha- tag. Pin a run with TRAIN_IMAGE_TAG=sha-<commit>.

# The blocks every backend repeated. `x-` prefixed top-level keys are Compose's own
# extension point -- it ignores them, so they exist to hold a YAML anchor that services
# alias. The healthcheck below was written out nine times and the credential pair
# eighteen, which is not only ~90 lines of a 367-line file but nine copies of one
# readiness contract that could drift apart one service at a time.
#
# `<<:` merges the anchor into a service that needs extra variables alongside it.

# Compose's analog of the chart's readinessProbe: /ready answers 503 until the service
# can actually serve, so `depends_on: condition: service_healthy` waits for a backend
# that works rather than one that has merely started.
x-backend-healthcheck: &backend-healthcheck
  test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 60s

# Both optional. The model and dataset repos are public, so a stack started with
# neither still pulls what it needs and serves; HF_TOKEN is for pushing, and without
# WANDB_API_KEY a training run logs offline.
# Everything a host-side `make check` leaves inside a service directory. Without these
# in the ignore list, one lint run looks like 33 source changes and restarts the
# container -- and the container, running as UID 1000, cannot delete mypy's locked
# SQLite files, so the sync then fails outright with a wall of "Permission denied".
x-watch-ignore: &watch-ignore
  - .venv/
  - __pycache__/
  - .mypy_cache/
  - .ruff_cache/
  - .pytest_cache/
  - "*.pyc"
  - .DS_Store

x-hub-credentials: &hub-credentials
  HF_TOKEN: ${HF_TOKEN:-}
  WANDB_API_KEY: ${WANDB_API_KEY:-}


services:
  # --- CBOW vectors: nearest-neighbour and analogy inference ---
  word-embeddings:
    image: roshb/ai-residency-word-embeddings-serve${WORD_EMBEDDINGS_REF:-:latest}
    ports:
      - "8001:8000"
    healthcheck: *backend-healthcheck
    environment: *hub-credentials

  # --- The regression head that consumes those vectors ---
  content-scoring:
    image: roshb/ai-residency-content-scoring-serve${CONTENT_SCORING_REF:-:latest}
    ports:
      - "8007:8000"
    healthcheck: *backend-healthcheck
    environment: *hub-credentials
    # `docker compose watch` -- edit the source and the container picks it up without a
    # rebuild. `sync+restart` rather than plain `sync`, because `python -m serving.api`
    # runs uvicorn without `--reload`: a synced file would sit in the container unread
    # until something else restarted it, which looks like an edit that did nothing.
    #
    # Source only. `action: rebuild` needs a `build:` context and these services are
    # image-only by design -- compose pulls what CI published rather than building it --
    # so a dependency change means `make local-up SERVICES="content-scoring"` again. A
    # synced pyproject.toml would change nothing anyway: the environment was installed at
    # build time.
    develop:
      watch:
        - action: sync+restart
          path: ../../services/content-scoring
          target: /app/services/content-scoring
          ignore:
            # Derived and large: the splits, the checkpoints and the run logs are all
            # rebuilt or re-pulled, and none of them is source.
            - data/
            - checkpoints/
            - checkpoints_logmse/
            - wandb/
            - assets/
            - .venv/
            - __pycache__/
            - .mypy_cache/
            - .ruff_cache/
            - .pytest_cache/
            - "*.pyc"
        - action: sync+restart
          path: ../../libs
          target: /app/libs
          ignore: *watch-ignore

  # --- Redis, for the retrieval service's HNSW index ---
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    command: ["redis-stack-server", "--save", "", "--appendonly", "no"]
    # No host port mapping: only vector-search-retrieval needs to reach this, over the
    # internal compose network (service name "redis"). Nothing outside it should.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  vector-search-retrieval:
    image: roshb/ai-residency-vector-search-retrieval-serve${VECTOR_SEARCH_RETRIEVAL_REF:-:latest}
    depends_on:
      # `condition: service_healthy`, not a bare list entry: the bare form only orders
      # container *start*, so this one could come up and try to reach a Redis that had
      # not begun accepting connections yet. The Helm chart closes the same race with
      # an init container.
      redis:
        condition: service_healthy
    environment:
      <<: *hub-credentials
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    # No data mount. The query tower, the CBOW vocabulary and tokenized_triples.json
    # all resolve from this service's Hugging Face dataset repo at startup, the same
    # way every other backend resolves its weights -- see retrieval/query_engine.py and
    # retrieval/save_doc_embeddings_to_redis.py, both of which go through
    # `resolve_required(..., repo_type="dataset")`.
    #
    # The mount that used to be here pointed at a host directory and made this the one
    # serving container that behaved differently on the machine that trained it.
    ports:
      - "8002:8000"
    healthcheck: *backend-healthcheck

  # --- Single-digit ViT classifier: FastAPI inference container ---
  vit-classifier:
    image: roshb/ai-residency-vit-classifier-serve${VIT_CLASSIFIER_REF:-:latest}
    ports:
      - "8003:8000"
    healthcheck: *backend-healthcheck
    environment: *hub-credentials

  # --- Multi-digit encoder-decoder ViT: FastAPI inference container ---
  vit-seq2seq:
    image: roshb/ai-residency-vit-seq2seq-serve${VIT_SEQ2SEQ_REF:-:latest}
    ports:
      - "8008:8000"
    healthcheck: *backend-healthcheck
    environment: *hub-credentials

  multimodal-captioning:
    image: roshb/ai-residency-multimodal-captioning-serve${MULTIMODAL_CAPTIONING_REF:-:latest}
    working_dir: /app
    ports:
      - "8004:8000"
    healthcheck: *backend-healthcheck
    environment: *hub-credentials

  whisper-fine-tuning:
    image: roshb/ai-residency-whisper-fine-tuning-serve${WHISPER_FINE_TUNING_REF:-:latest}
    ports:
      - "8005:8000"
    healthcheck: *backend-healthcheck
    environment: *hub-credentials

  # --- Emotion-aware Whisper: FastAPI inference container ---
  speech-emotion-recognition:
    image: roshb/ai-residency-speech-emotion-recognition-serve${SPEECH_EMOTION_RECOGNITION_REF:-:latest}
    ports:
      - "8009:8000"
    healthcheck: *backend-healthcheck
    environment: *hub-credentials

  rlhf-ppo:
    image: roshb/ai-residency-rlhf-ppo-serve${RLHF_PPO_REF:-:latest}
    volumes:
      # /home/app, not /root: these containers run as UID 1000, and the image sets
      # HF_HOME=/home/app/.cache/huggingface. Mounted at /root the cache was inert --
      # nothing ever wrote there -- so this service re-downloaded a multi-GB backbone
      # on every fresh run while looking like it had a warm cache. Written when the
      # images still ran as root, and never revisited when they stopped.
      - ${HOME}/.cache/huggingface:/home/app/.cache/huggingface
    ports:
      - "8006:8000"
    healthcheck: *backend-healthcheck
    environment: *hub-credentials

  frontend:
    image: roshb/ai-residency-frontend${FRONTEND_REF:-:latest}
    # Streamlit watches its own files, but only offers a rerun prompt unless runOnSave is
    # set, and that lives in the image's CMD. Restarting is two seconds and needs no
    # production change.
    # `docker compose watch frontend` pulls every backend first, because watch resolves
    # depends_on and does not take --no-deps. Use `--no-up` when the stack is already
    # running: `docker compose watch --no-up frontend content-scoring`.
    develop:
      watch:
        - action: sync+restart
          path: ../../services/frontend
          target: /app/services/frontend
          ignore: *watch-ignore
    depends_on:
      - word-embeddings
      - content-scoring
      - vector-search-retrieval
      - vit-classifier
      - vit-seq2seq
      - multimodal-captioning
      - whisper-fine-tuning
      - speech-emotion-recognition
      - rlhf-ppo
    environment:
      WORD_EMBEDDINGS_API_URL: http://word-embeddings:8000
      CONTENT_SCORING_API_URL: http://content-scoring:8000
      VECTOR_SEARCH_RETRIEVAL_API_URL: http://vector-search-retrieval:8000
      VIT_CLASSIFIER_API_URL: http://vit-classifier:8000
      VIT_SEQ2SEQ_API_URL: http://vit-seq2seq:8000
      MULTIMODAL_CAPTIONING_API_URL: http://multimodal-captioning:8000
      WHISPER_FINE_TUNING_API_URL: http://whisper-fine-tuning:8000
      SPEECH_EMOTION_RECOGNITION_API_URL: http://speech-emotion-recognition:8000
      RLHF_PPO_API_URL: http://rlhf-ppo:8000
      # Which pages this instance shows. Empty means all of them -- the portfolio
      # hub. `make up SERVICES="word-embeddings"` sets it to what it started, so
      # running one system gives a UI for that system rather than a hub with eight
      # dead pages. The frontend image is the same either way; no backend grows a UI.
      AI_RESIDENCY_PAGES: ${AI_RESIDENCY_PAGES:-}
    ports:
      - "8500:8501"

  # --- Training, profile-gated so a plain `docker compose up` never starts a run ---
  #
  # Each pulls that service's Dockerfile.train image (a real, distinct image from the
  # serving one). AI_RESIDENCY_NUM_EPOCHS (read by every Config, see
  # ai_residency_common.BaseConfig) keeps these to a smoke run by default; override it
  # for a real one.
  #
  #   HF_TOKEN=... docker compose --profile train run --rm train-vit-classifier
  #
  # These mount a host directory so a local run's intermediate data (corpora, tokenized
  # triples) survives between stages. Serving mounts nothing: it resolves everything
  # from the Hub.

  train-word-embeddings:
    profiles: [train]
    image: roshb/ai-residency-word-embeddings-train:${TRAIN_IMAGE_TAG:-latest}
    volumes:
      - ../../services/word-embeddings/data:/app/data
    environment:
      <<: *hub-credentials
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}

  train-content-scoring:
    profiles: [train]
    image: roshb/ai-residency-content-scoring-train:${TRAIN_IMAGE_TAG:-latest}
    # The splits and the title corpus are derived from the Hub mirror rather than
    # published, so without this mount every container run rebuilds them from an 85MB
    # download. They are a cache, not state: deleting the directory costs a few minutes,
    # not a re-training.
    volumes:
      - ../../services/content-scoring/data:/app/data
    environment:
      <<: *hub-credentials
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}

  train-vector-search-retrieval:
    profiles: [train]
    image: roshb/ai-residency-vector-search-retrieval-train:${TRAIN_IMAGE_TAG:-latest}
    # No command override: the image's own CMD is the single source of truth for what
    # a training container runs, so it cannot drift from the Dockerfile.
    depends_on:
      - redis
    volumes:
      - ../../services/vector-search-retrieval/data:/app/data
    environment:
      <<: *hub-credentials
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}

  train-vit-classifier:
    profiles: [train]
    image: roshb/ai-residency-vit-classifier-train:${TRAIN_IMAGE_TAG:-latest}
    volumes:
      - ../../services/vit-classifier/data:/app/data
    environment:
      <<: *hub-credentials
      # The classifier's epoch cap is its own field, so AI_RESIDENCY_NUM_EPOCHS alone
      # would not shorten a run.
      AI_RESIDENCY_CLASSIFIER_EPOCHS: ${AI_RESIDENCY_CLASSIFIER_EPOCHS:-1}

  train-vit-seq2seq:
    profiles: [train]
    image: roshb/ai-residency-vit-seq2seq-train:${TRAIN_IMAGE_TAG:-latest}
    volumes:
      - ../../services/vit-seq2seq/data:/app/data
    environment:
      <<: *hub-credentials
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}


  train-multimodal-captioning:
    profiles: [train]
    image: roshb/ai-residency-multimodal-captioning-train:${TRAIN_IMAGE_TAG:-latest}
    working_dir: /app
    environment:
      <<: *hub-credentials
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}
      # Never overwrite the committed adapter during a smoke run.
      AI_RESIDENCY_CHECKPOINT_NAME: ${AI_RESIDENCY_CHECKPOINT_NAME:-adapter_smoke.pth}

  train-whisper-fine-tuning:
    profiles: [train]
    image: roshb/ai-residency-whisper-fine-tuning-train:${TRAIN_IMAGE_TAG:-latest}
    volumes:
      - ../../services/whisper-fine-tuning/data:/app/data
    environment:
      <<: *hub-credentials
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}

  train-speech-emotion-recognition:
    profiles: [train]
    image: roshb/ai-residency-speech-emotion-recognition-train:${TRAIN_IMAGE_TAG:-latest}
    volumes:
      - ../../services/speech-emotion-recognition/data:/app/data
      - ../../services/speech-emotion-recognition/datasets:/app/datasets
    environment:
      <<: *hub-credentials
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}

  train-rlhf-ppo:
    profiles: [train]
    image: roshb/ai-residency-rlhf-ppo-train:${TRAIN_IMAGE_TAG:-latest}
    # One PPO step -- this repo has no epoch loop, by design.
    volumes:
      - ${HOME}/.cache/huggingface:/home/app/.cache/huggingface
    environment: *hub-credentials
