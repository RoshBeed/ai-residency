# Orchestrates all six AI Residency week repos' published containers plus one shared Redis
# for vector-search-retrieval, plus the portfolio frontend that calls all six backends directly over
# HTTP. This is the docker-compose on-ramp to the Kubernetes chart in helm/.
#
# Every weekN image is pulled from Docker Hub (roshbeed/ai-residency-weekN-serve / -train),
# pushed there by that week repo's own `make docker-push-serve` / `docker-push-train`.
# Nothing here builds from source -- this repo only *deploys* the containers the week
# repos publish. The frontend image (roshbeed/ai-residency-frontend) is published by
# the ai-residency-frontend repo the same way.
#
# Trained checkpoints are still bind-mounted from the sibling ai-residency-weekN-... repos on
# this host (the fast local path); each backend also falls back to pulling them from
# the Hugging Face Hub when a mount is absent (see ai-residency-common's resolve_checkpoint).
#
# Those mounts are deliberately writable, not :ro. resolve_checkpoint's Hub fallback
# *downloads into the same directory*, so a read-only mount turns the fallback into a
# guaranteed failure (`[Errno 30] Read-only file system`) on exactly the hosts that need
# it -- the ones without a local copy.

services:
  # --- Week 1a: word-embeddings — nearest-neighbour/analogy inference container ---
  word-embeddings:
    image: roshbeed/ai-residency-word-embeddings-serve:latest
    ports:
      - "8001:8000"
    volumes:
      - ../../services/word-embeddings/checkpoints:/app/checkpoints
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}

  # --- Week 1b: content-scoring — the regression head that consumes those vectors ---
  content-scoring:
    image: roshbeed/ai-residency-content-scoring-serve:latest
    ports:
      - "8007:8000"
    volumes:
      - ../../services/content-scoring/checkpoints:/app/checkpoints
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}

  # --- Week 2: needs its own Redis (HNSW retrieval index) ---
  redis:
    image: redis/redis-stack-server:latest
    command: ["redis-stack-server", "--save", "", "--appendonly", "no"]
    # No host port mapping -- only vector-search-retrieval's own serve container needs to reach this,
    # over the internal compose network (service name "redis"). Deliberately
    # not bound to the host to avoid colliding with the original Week2 repo's own
    # persistent redis container, which already owns host port 6390.

  vector-search-retrieval:
    image: roshbeed/ai-residency-vector-search-retrieval-serve:latest
    depends_on:
      - redis
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    volumes:
      # Trained towers + CBOW vocab/embeddings, gitignored from the image -- mount
      # from the sibling repo at runtime. data/ holds tokenized_triples.json, needed
      # once to (re)populate this hub's own (fresh, empty) redis index.
      - ../../services/vector-search-retrieval/checkpoints:/app/checkpoints
      - ../../services/vector-search-retrieval/data:/app/data
    ports:
      - "8002:8000"

  # --- Week 3: FastAPI inference container (both classifier and seq2seq) ---
  vision-transformers:
    image: roshbeed/ai-residency-vision-transformers-serve:latest
    volumes:
      - ../../services/vision-transformers/checkpoints:/app/checkpoints
    ports:
      - "8003:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}

  multimodal-captioning:
    image: roshbeed/ai-residency-multimodal-captioning-serve:latest
    volumes:
      # Week 4's adapter checkpoints are gitignored from the build context, so this
      # mount is what actually supplies them at run time.
      - ../../services/multimodal-captioning/checkpoints:/app/checkpoints
    working_dir: /app
    ports:
      - "8004:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}

  audio-fine-tuning:
    image: roshbeed/ai-residency-audio-fine-tuning-serve:latest
    volumes:
      - ../../services/audio-fine-tuning/checkpoints:/app/checkpoints
    ports:
      - "8005:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}

  rlhf-ppo:
    image: roshbeed/ai-residency-rlhf-ppo-serve:latest
    volumes:
      - ../../services/rlhf-ppo/checkpoints:/app/checkpoints
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8006:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      HF_HOME: /root/.cache/huggingface

  frontend:
    image: roshbeed/ai-residency-frontend:latest
    depends_on:
      - word-embeddings
      - content-scoring
      - vector-search-retrieval
      - vision-transformers
      - multimodal-captioning
      - audio-fine-tuning
      - rlhf-ppo
    environment:
      WORD_EMBEDDINGS_API_URL: http://word-embeddings:8000
      CONTENT_SCORING_API_URL: http://content-scoring:8000
      VECTOR_SEARCH_RETRIEVAL_API_URL: http://vector-search-retrieval:8000
      VISION_TRANSFORMERS_API_URL: http://vision-transformers:8000
      MULTIMODAL_CAPTIONING_API_URL: http://multimodal-captioning:8000
      AUDIO_FINE_TUNING_API_URL: http://audio-fine-tuning:8000
      RLHF_PPO_API_URL: http://rlhf-ppo:8000
    ports:
      - "8500:8501"

  # --- Training, profile-gated so a plain `docker compose up` never starts a run ---
  #
  # Each pulls the week repo's Dockerfile.train image (a real, distinct image from
  # the serving one). AI_RESIDENCY_NUM_EPOCHS (read by every repo's Config, see ai-residency-common's
  # BaseConfig) keeps these to a smoke run by default; override it for a real one.
  #
  #   HF_TOKEN=... docker compose --profile train run --rm train-vision-transformers
  #
  # Checkpoint mounts are writable here, unlike the read-only serving mounts: this is
  # the process that writes them.

  train-word-embeddings:
    profiles: [train]
    image: roshbeed/ai-residency-word-embeddings-train:latest
    volumes:
      - ../../services/word-embeddings/checkpoints:/app/checkpoints
      - ../../services/word-embeddings/data:/app/data
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      AI_RESIDENCY_CBOW_NUM_EPOCHS: ${AI_RESIDENCY_CBOW_NUM_EPOCHS:-1}

  train-content-scoring:
    profiles: [train]
    image: roshbeed/ai-residency-content-scoring-train:latest
    volumes:
      - ../../services/content-scoring/checkpoints:/app/checkpoints
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}

  train-vector-search-retrieval:
    profiles: [train]
    image: roshbeed/ai-residency-vector-search-retrieval-train:latest
    command: ["uv", "run", "python", "-m", "training"]
    depends_on:
      - redis
    volumes:
      - ../../services/vector-search-retrieval/checkpoints:/app/checkpoints
      - ../../services/vector-search-retrieval/data:/app/data
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}

  train-vision-transformers:
    profiles: [train]
    image: roshbeed/ai-residency-vision-transformers-train:latest
    # Dockerfile.train's own default is the classifier; pass
    # `command: ["uv", "run", "python", "-m", "models.seq2seq.trainer"]`
    # for the seq2seq trainer.
    volumes:
      - ../../services/vision-transformers/checkpoints:/app/checkpoints
      - ../../services/vision-transformers/data:/app/data
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      # This repo trains two models with separate epoch caps, so the classifier's is
      # classifier_epochs, not num_epochs -- AI_RESIDENCY_NUM_EPOCHS alone would not shorten it.
      AI_RESIDENCY_CLASSIFIER_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}

  train-multimodal-captioning:
    profiles: [train]
    image: roshbeed/ai-residency-multimodal-captioning-train:latest
    volumes:
      - ../../services/multimodal-captioning/checkpoints:/app/checkpoints
    working_dir: /app
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}
      # Never overwrite the committed adapter during a smoke run.
      AI_RESIDENCY_CHECKPOINT_NAME: ${AI_RESIDENCY_CHECKPOINT_NAME:-adapter_smoke.pth}

  train-audio-fine-tuning:
    profiles: [train]
    image: roshbeed/ai-residency-audio-fine-tuning-train:latest
    volumes:
      - ../../services/audio-fine-tuning/checkpoints:/app/checkpoints
      - ../../services/audio-fine-tuning/data:/app/data
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      AI_RESIDENCY_NUM_EPOCHS: ${AI_RESIDENCY_NUM_EPOCHS:-1}

  train-rlhf-ppo:
    profiles: [train]
    image: roshbeed/ai-residency-rlhf-ppo-train:latest
    # One PPO step -- this repo has no epoch loop, by design.
    volumes:
      - ../../services/rlhf-ppo/checkpoints:/app/checkpoints
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
